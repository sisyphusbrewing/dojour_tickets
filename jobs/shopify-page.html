<!-- Sisyphus: body of the Shopify page "Jobs" (handle: jobs). Embeds the job
     post and application form from GitHub Pages so applicants only see
     sisyphusbrewing.com. Pass ?role=... through for other roles later. -->
<div class="sb-jobs" style="max-width:720px;margin:0 auto;">
  <iframe id="sbJobs" title="Work at Sisyphus" src="about:blank"
          style="display:block;width:100%;height:100vh;border:0;border-radius:14px;background:#2b2929;"
          loading="eager"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('sbJobs');
    f.src = 'https://sisyphusbrewing.github.io/dojour_tickets/jobs/' + window.location.search;
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://sisyphusbrewing.github.io' || !e.data) return;
      if (e.data.jobsHeight) f.style.height = (e.data.jobsHeight + 16) + 'px';
      if (e.data.jobsScrollTop) window.scrollTo({ top: f.getBoundingClientRect().top + window.pageYOffset - 90, behavior: 'smooth' });
    });
  })();
</script>

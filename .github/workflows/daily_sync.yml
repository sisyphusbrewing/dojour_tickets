name: Sync Ticket Sales

on:
  workflow_dispatch:
  schedule:
    # Daily sync at 13:00 UTC (8:00 AM Central)
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
            pip install requests gspread playwright
            playwright install chromium
            
      - name: Run ticket sync
        env:
          DOJOUR_STATE: ${{ secrets.DOJOUR_STATE }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
       run: python diagnose_dojour.py

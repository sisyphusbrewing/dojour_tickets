name: Daily DoJour Ticket Sync

on:
  schedule:
    # 13:00 UTC = 8:00 AM Central Time
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright gspread google-auth requests
          playwright install --with-deps chromium

- name: Run ticket sync
      env:
        DOJOUR_STATE: ${{ secrets.DOJOUR_STATE }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      run: python fetch_tickets.py

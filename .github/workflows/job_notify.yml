name: Job application

# Someone applied on jobs/index.html (sisyphusbrewing.com/pages/jobs). The
# "job-applied" Supabase function starts this, and it emails the answers and
# résumé to booking@ (job_notify.py). Set the JOBS_EMAIL_TO repo variable to
# send them somewhere else.

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: 'job_applications.id to email'
        required: true
        type: string

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Email the application to booking
        env:
          APPLICATION_ID: ${{ inputs.application_id }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          JOBS_EMAIL_TO: ${{ vars.JOBS_EMAIL_TO }}
        run: python job_notify.py

name: Buyer email list

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Performer or show name (e.g. Ali Sultan)"
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Build buyer list
        env:
          SHOW_QUERY: ${{ inputs.show }}
          DOJOUR_STATE: ${{ secrets.DOJOUR_STATE }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python buyer_list.py
      - uses: actions/upload-artifact@v4
        with:
          name: buyer_list
          path: buyer_list.csv
          retention-days: 7

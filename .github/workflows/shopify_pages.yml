name: Shopify pages

# Pushes website page text kept in this repo (mic/shopify-page.html,
# pages/*.html) to the matching Shopify page when it changes on main.
# Pages only, never the theme.
on:
  push:
    branches: [main]
    paths:
      - 'mic/shopify-page.html'
      - 'pages/*.html'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Update pages
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python shopify_pages.py

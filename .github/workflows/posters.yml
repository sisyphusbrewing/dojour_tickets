name: Show posters

# Makes a print-ready 11 x 17 in poster for every upcoming show (make_posters.py)
# and keeps them on the repo's "posters" release, so each show has a stable link:
#   https://github.com/<owner>/<repo>/releases/tag/posters
# The same run makes phone-sized social images (make_social.py: 4:5 feed + 9:16 story per show)
# and keeps them on the "social" release: .../releases/download/social/<handle>-feed.jpg
# Runs after the daily sync and after a show is created, or on demand.

on:
  workflow_dispatch:
    inputs:
      handles:
        description: 'Only these shows (product handles, space-separated). Blank = every upcoming show.'
        required: false
        type: string
      from:
        description: 'Skip shows before this one (product handle); affects print-order.pdf too.'
        required: false
        type: string
      email:
        description: 'Email these posters (product handles, space-separated) to POSTER_EMAIL_TO.'
        required: false
        type: string
  workflow_run:
    workflows: ["Sync Ticket Sales", "Create Shopify Show Tickets"]
    types: [completed]
  schedule:
    - cron: '0 14 * * 1'          # Mondays 9 AM Central: the weekly poster email

permissions:
  contents: write

concurrency:
  group: show-posters
  cancel-in-progress: false

jobs:
  posters:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow reportlab pypdf "opencv-python-headless==4.10.0.84"

      - name: Make posters
        env:
          HANDLES: ${{ inputs.handles }}
          POSTER_FROM: ${{ inputs.from }}
        run: python make_posters.py $HANDLES

      - name: Make social images
        env:
          HANDLES: ${{ inputs.handles }}
        run: python make_social.py $HANDLES

      - name: Publish to the "social" release
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.handles }}
        run: |
          if ! gh release view social >/dev/null 2>&1; then
            gh release create social --title "Social images" --notes "Feed (1080x1350) and story (1080x1920) images for every upcoming show." --latest=false
          fi
          gh release upload social social/out/*.jpg social/out/manifest.json --clobber
          if [ -z "$ONLY" ]; then
            for asset in $(gh release view social --json assets -q '.assets[].name'); do
              [ -f "social/out/$asset" ] || gh release delete-asset social "$asset" -y
            done
          fi

      - name: Attach posters to this run
        uses: actions/upload-artifact@v4
        with:
          name: show-posters
          path: posters/out/*.pdf
          retention-days: 30

      - name: Publish to the "posters" release
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.handles }}${{ inputs.from }}
        run: |
          if ! gh release view posters >/dev/null 2>&1; then
            gh release create posters --title "Show posters" --notes "Print-ready 11 x 17 in show posters." --latest=false
          fi
          gh release upload posters posters/out/*.pdf --clobber
          if [ -z "$ONLY" ]; then
            # A full run replaces the whole set: drop posters for shows that are no longer listed.
            for asset in $(gh release view posters --json assets -q '.assets[].name'); do
              [ -f "posters/out/$asset" ] || gh release delete-asset posters "$asset" -y
            done
          fi
          gh release edit posters --notes-file posters/out/RELEASE_NOTES.md

      # Mondays: the week's new posters go to POSTER_EMAIL_TO (booking). The "email" box sends any poster by hand.
      - name: Email posters
        if: ${{ github.event_name == 'schedule' || inputs.email != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          POSTER_EMAIL_TO: ${{ vars.POSTER_EMAIL_TO || 'booking@sisyphusbrewing.com' }}
          EMAIL: ${{ inputs.email }}
        run: |
          if [ -n "$EMAIL" ]; then python email_posters.py $EMAIL; else python email_posters.py --weekly; fi

name: Create Shopify Show Tickets

on:
  workflow_dispatch:
    inputs:
      comedian_name:
        description: 'Comedian / Show Title'
        required: true
        type: string
      showtimes:
        description: 'Showtimes / Passes (e.g. "Oct 11 5pm" or "Oct 24 7pm, Oct 24 9pm")'
        required: true
        type: string
      ticket_price:
        description: 'Ticket / Registration Price USD'
        required: true
        default: '20.00'
        type: string
      room_capacity:
        description: 'Room Capacity / Ticket Limit per variant'
        required: true
        default: '75'
        type: string
      bio:
        description: 'Event Description / Bio / Class Details'
        required: false
        type: string
      image_url:
        description: 'Image URL (flyer/promo photo)'
        required: false
        type: string

jobs:
  create-show:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Ticket Product Builder
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOW_TITLE: ${{ inputs.comedian_name }}
          SHOW_DATE: ${{ inputs.showtimes }}
          SHOW_PRICE: ${{ inputs.ticket_price }}
          SHOW_CAPACITY: ${{ inputs.room_capacity }}
          SHOW_BIO: ${{ inputs.bio }}
          SHOW_IMAGE_URL: ${{ inputs.image_url }}
        run: python ticket_product_builder.py

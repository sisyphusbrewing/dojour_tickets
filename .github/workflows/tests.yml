name: Tests

# Runs the quick checks on every pull request, so a change that breaks ticket
# swaps, the settlement math or the inventory mirror is caught before merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m unittest test_exchange_ticket test_settlement_draft test_sync_inventory test_dojour_refund

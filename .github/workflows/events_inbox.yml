name: Events inbox

# Reads the events@ inbox (read-only) and sorts each conversation: private
# event and group asks, ticket problems, accessibility questions, donation
# requests, sales pitches. See events_inbox.py. (Sam, Nov 17 2026: "We should
# probably do this for the events@ email as well")
#
# Needs the secret EVENTS_IMAP_PASS, an app password for the events@ Google
# account. Until it exists every run says so and stops without an error.
# This repo's logs are public: the script prints counts only, never names,
# addresses or subject lines.

on:
  schedule:
    # Every hour at :41, 7 AM to 11 PM Central (13:41 to 05:41 UTC in winter;
    # an hour later by the clock in summer)
    - cron: '41 0-5,13-23 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read (60 for the first catch-up)"
        default: "3"
      dry_run:
        description: "Dry run: count what it would file, save nothing"
        type: boolean
        default: false

concurrency:
  group: events-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read events@ and sort what landed there
        env:
          DAYS: ${{ inputs.days || '3' }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENTS_IMAP_PASS: ${{ secrets.EVENTS_IMAP_PASS }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python events_inbox.py

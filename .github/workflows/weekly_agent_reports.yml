name: Weekly Agent Ticket Reports

on:
  schedule:
    # Runs every Monday at 9:00 AM Central (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Manual run from GitHub, or one agent's on-demand report
    inputs:
      token:
        description: 'show_agents.token: email just this agent, now (blank = everyone)'
        required: false
        type: string

jobs:
  send-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Agent Report Dispatcher
        env:
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          AGENT_TOKEN: ${{ inputs.token }}
        run: python send_weekly_agent_reports.py

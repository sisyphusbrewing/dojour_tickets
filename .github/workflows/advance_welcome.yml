name: Comedian welcome

# The "you're coming to Sisyphus" email for a newly booked comedian
# (advance_welcome.py). Started from the booking desk's "Send the welcome"
# button through the run-workflow Supabase function. Fill in "to" to send a
# preview somewhere else instead.

on:
  workflow_dispatch:
    inputs:
      advance_id:
        description: 'advances.id to welcome'
        required: true
        type: string
      to:
        description: 'Preview: send here instead of the comedian'
        required: false
        type: string

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send the welcome email
        env:
          ADVANCE_ID: ${{ inputs.advance_id }}
          WELCOME_TO: ${{ inputs.to }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python advance_welcome.py

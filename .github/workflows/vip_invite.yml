name: VIP Table Emails

# Emails each VIP / Reserved Seating buyer the table form (vip/), and a
# show-morning reminder if they haven't answered. Invites go out the day
# before the show. Set the repo variable VIP_EMAILS_LIVE to "off" to pause.

on:
  schedule:
    # Every 20 minutes at odd minutes, 8 AM to 11 PM Central. GitHub skipped most
    # of the hourly :15 runs on Nov 5-6 2026 (busy top-of-hour slots), so this runs
    # more often off the busy minutes; the script never emails anyone twice.
    # GitHub still ran only 3 of ~45 scheduled runs on Nov 6-7, so each run now
    # also starts the next one 20 minutes later (last step). The schedule stays
    # as a backup that restarts the chain if it ever breaks. To stop everything,
    # disable this workflow in the Actions tab; VIP_EMAILS_LIVE=off just pauses sends.
    - cron: '7,27,47 0-4,13-23 * * *'
  workflow_dispatch:
    inputs:
      preview_to:
        description: 'Send one sample invite + reminder to this address only (no customers)'
        required: false
        type: string
      dry_run:
        description: 'Print who would get what, send nothing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # lets each run start the next one (see the last step)

concurrency:
  group: vip-invite
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send VIP table emails
        env:
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          VIP_EMAILS_LIVE: ${{ vars.VIP_EMAILS_LIVE }}
          PREVIEW_TO: ${{ inputs.preview_to }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python vip_invite.py
      - name: Start the next run in 20 minutes
        # Skipped for previews and dry runs. Only one run waits at a time
        # (concurrency group above), so extra chains fold into one.
        if: ${{ always() && !inputs.preview_to && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1200
          gh workflow run vip_invite.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Block Website Sales on Dojour

on:
  schedule:
    # Daily 14:20 UTC = 8:20 AM Central. Plan only: Dojour refuses holds made by
    # scripts. A Claude scheduled task adds the holds in Sam's Chrome at 7:43 AM
    # and 4:43 PM Central (Nov 18 2026), so this run is the backup: it emails Sam
    # only if seats are still unblocked.
    - cron: '20 14 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create the holds (unchecked = show the plan only)'
        type: boolean
        default: false
      max_hold:
        description: 'Testing: cap each hold at this many seats (blank = no cap)'
        required: false
        type: string
      notify_to:
        description: 'Testing: email the plan to this address (blank = no email)'
        required: false
        type: string
      instance_ids:
        description: 'Only these Dojour showtime ids (comma separated, blank = all)'
        required: false
        type: string

jobs:
  holds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Pull live Shopify sales
        continue-on-error: true
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_tickets.py --shopify-only

      - name: Hold website seats on Dojour
        env:
          DOJOUR_STATE: ${{ secrets.DOJOUR_STATE }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs only plan until the first live test is confirmed.
          APPLY: ${{ inputs.apply && '1' || '' }}
          INSTANCE_IDS: ${{ inputs.instance_ids }}
          MAX_HOLD: ${{ inputs.max_hold }}
          NOTIFY_TO: ${{ github.event_name == 'schedule' && 'sam@sisyphusbrewing.com' || inputs.notify_to }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python dojour_holds.py

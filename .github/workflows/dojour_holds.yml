name: Block Website Sales on Dojour

on:
  schedule:
    # 20 minutes after each Sync Ticket Sales run, so Supabase has fresh website sales.
    - cron: '20 */4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create the holds (unchecked = show the plan only)'
        type: boolean
        default: false
      instance_ids:
        description: 'Only these Dojour showtime ids (comma separated, blank = all)'
        required: false
        type: string

jobs:
  holds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Pull live Shopify sales
        continue-on-error: true
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_tickets.py --shopify-only

      - name: Hold website seats on Dojour
        env:
          DOJOUR_STATE: ${{ secrets.DOJOUR_STATE }}
          SUPABASE_URL: "https://idsdwkubqnavkazlteis.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs only plan until the first live test is confirmed.
          APPLY: ${{ inputs.apply && '1' || '' }}
          INSTANCE_IDS: ${{ inputs.instance_ids }}
        run: python dojour_holds.py

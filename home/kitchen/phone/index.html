<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<title>Kitchen Screen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  /* The kitchen screen's remote: Lindsey (or Sam) picks what the kitchen
     display shows, writes the note in big letters, and keeps the kitchen
     list (Sam, Nov 22 2026: "Lindsey wants more control over what shows up").
     Changes reach the display within a minute. ?k=<edit key> from
     home_boards; ?preview=1 is a demo that saves nothing. */
  :root { --bg: #14110f; --card: #1f1a17; --card2: #2a231f; --line: rgba(255,240,225,.12); --text: #f7efe6; --muted: #b9a999; --warm: #f2b56b; --on: #9cc5a1; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #faf6f1; --card: #fff; --card2: #f3ece4; --line: rgba(20,17,15,.1); --text: #1d1915; --muted: #7a6a5c; --warm: #d98b2b; --on: #4f8f5a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: Nunito, system-ui, sans-serif; font-size: 17px; padding: calc(env(safe-area-inset-top) + 18px) 16px 60px; max-width: 560px; margin: 0 auto; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; }
  .sub { color: var(--muted); margin: 2px 0 18px; }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; font-weight: 800; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; }

  /* What shows: big tiles that light up */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 12px; text-align: left; display: flex; gap: 10px; align-items: center; transition: transform .12s, border-color .2s, opacity .2s; opacity: .55; }
  .tile .e { font-size: 26px; filter: grayscale(1); transition: filter .2s; }
  .tile b { display: block; font-weight: 800; }
  .tile small { color: var(--muted); }
  .tile.on { border-color: var(--on); opacity: 1; }
  .tile.on .e { filter: none; }
  .tile:active { transform: scale(.96); }

  textarea { width: 100%; background: var(--card2); border: 0; border-radius: 12px; padding: 12px; min-height: 84px; resize: vertical; font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .btn { background: var(--warm); color: #1d1208; font-weight: 800; border-radius: 12px; padding: 11px 16px; }
  .ghost { color: var(--muted); font-weight: 700; padding: 11px 8px; }
  .count { margin-left: auto; color: var(--muted); font-size: 14px; }

  .add { display: flex; gap: 8px; }
  .add input { flex: 1; min-width: 0; background: var(--card2); border: 0; border-radius: 12px; padding: 12px; }
  ul { list-style: none; margin-top: 8px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .box { flex: none; width: 26px; height: 26px; border: 3px solid var(--warm); border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #1d1208; }
  li.done .box { background: var(--warm); }
  li.done .t { color: var(--muted); text-decoration: line-through; }
  li .t { flex: 1; }
  li .x { color: var(--muted); font-size: 20px; padding: 0 6px; }
  .empty { color: var(--muted); padding: 10px 4px; }
  .clear { margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 140%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; transition: transform .25s; max-width: calc(100% - 32px); }
  #toast.show { transform: translate(-50%, 0); }
  .who { display: flex; gap: 6px; }
  .who button { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
  .who button.on { border-color: var(--warm); }
  /* Our house: next step of each project, tick it off, add a new one
     (Sam, Nov 24 2026: the remote "should then let you edit or add more
     stuff (like to the house project list)"). The full board is one tap. */
  .hp { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); }
  .hp:first-child { border-top: 0; }
  .hp .e { font-size: 24px; flex: none; }
  .hp .t { flex: 1; min-width: 0; }
  .hp .t b { display: block; font-weight: 800; }
  .hp .t small { color: var(--muted); }
  .hp .tick { flex: none; border: 3px solid var(--warm); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
  .kinds { display: flex; gap: 6px; margin-top: 10px; }
  .kinds button { background: var(--card2); border: 2px solid transparent; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
  .kinds button.on { border-color: var(--warm); }
  .full { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--card2); color: var(--text); font-weight: 800; text-decoration: none; }
  .bad { background: var(--card); border-radius: 18px; padding: 18px; margin-top: 20px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🍳 Kitchen screen</h1>
  <div class="sub" id="sub">What the kitchen display shows. Changes show up there within a minute.</div>
</header>

<div id="app" class="hidden">
  <h2>Note on the screen</h2>
  <div class="card">
    <textarea id="note" maxlength="280" placeholder="Pizza night! Dad's picking up."></textarea>
    <div class="row"><button class="btn" id="savenote">Put it up</button><button class="ghost" id="clearnote">Take it down</button><span class="count" id="count"></span></div>
  </div>

  <h2>Kitchen list</h2>
  <div class="card">
    <form class="add" id="addform"><input id="additem" maxlength="120" placeholder="Add something (milk, call the vet...)" autocomplete="off"><button class="btn">Add</button></form>
    <ul id="list"></ul>
    <button class="ghost clear hidden" id="clearDone">Clear the ticked-off ones</button>
  </div>

  <h2>Our house</h2>
  <div class="card">
    <div id="house"></div>
    <form class="add" id="houseform" style="margin-top:10px"><input id="houseitem" maxlength="120" placeholder="Add a project or idea" autocomplete="off"><button class="btn">Add</button></form>
    <div class="kinds" id="kinds"><button type="button" data-k="project" class="on">🛠️ Project</button><button type="button" data-k="goal">🎯 Goal</button><button type="button" data-k="idea">💡 Idea</button></div>
    <a class="full" id="fullboard" href="/home/projects/">Open the house board: steps, goals, ideas →</a>
  </div>

  <h2>What shows</h2>
  <div class="tiles" id="tiles"></div>

  <h2>Who's this?</h2>
  <div class="who" id="who"></div>
</div>
<div class="bad hidden" id="bad">This link doesn't open the kitchen screen. Ask Sam for the link again.</div>
<div id="toast"></div>

<script>
var Q = new URLSearchParams(location.search);
var KEY = Q.get('k') || '', PREVIEW = Q.get('preview') === '1';
var SB = 'https://idsdwkubqnavkazlteis.supabase.co/rest/v1/rpc/';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc2R3a3VicW5hdmthemx0ZWlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTA2MTMsImV4cCI6MjEwNTY2NjYxM30.EUnNEOHYlNup7nBFvs--pCiyis-NYPiL_TeoiMEjDRQ';
// Same parts and same starting choices as the display (/home/kitchen/).
var PARTS = [
  ['clock', '🕰️', 'Clock', 'Time and date'], ['weather', '⛅', 'Weather', 'Now and later today'],
  ['note', '📌', 'Note', 'Your note, big'], ['calendar', '📅', 'Calendar', 'Today and tomorrow'],
  ['list', '🛒', 'Kitchen list', 'Groceries, to-dos'], ['house', '🏡', 'Our house', 'Next project steps'],
  ['shows', '🎤', 'Sisyphus', 'Next shows at the club']
];
var DEFAULTS = { clock: true, weather: true, calendar: true, list: true, note: true, house: true, shows: false };
var BOARD = null, WHO = '', HKIND = 'project';

function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
var toastT;
function toast(t) { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { $('toast').classList.remove('show'); }, 2200); }

function call(fn, body) {
  if (PREVIEW) return Promise.resolve(fake(fn, body));
  return fetch(SB + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'That didn\'t save.'); return j; }); });
}
function edit(op, args) {
  return call('kitchen_edit', { k: KEY, op: op, args: Object.assign({ who: WHO || null }, args || {}) })
    .then(function (b) { BOARD = b; draw(); return b; })
    .catch(function (e) { toast(e.message || 'That didn\'t save. Try again.'); throw e; });
}

function houseEdit(op, args) {
  if (PREVIEW) { fakeHouse(op, args); draw(); return Promise.resolve(); }
  return call('home_board_edit', { k: KEY, op: op, args: Object.assign({ who: WHO || null }, args || {}) })
    .then(function () { return call('kitchen_board', { k: KEY }); })
    .then(function (b) { BOARD = b; draw(); })
    .catch(function (e) { toast(e.message || 'That didn\'t save. Try again.'); throw e; });
}
function nextStep(i) { return (i.steps || []).filter(function (s) { return !s.done_at; })[0]; }
function drawHouse() {
  var work = (BOARD.items || []).filter(function (i) { return (i.kind === 'project' || i.kind === 'goal') && !i.done_at; });
  var ideas = (BOARD.items || []).filter(function (i) { return i.kind === 'idea' && !i.done_at; }).length;
  $('house').innerHTML = (work.length ? work.map(function (i) {
    var n = nextStep(i), steps = i.steps || [], left = steps.filter(function (s) { return !s.done_at; }).length;
    var sub = n ? 'Next: ' + esc(n.title) + (left > 1 ? ' · ' + left + ' steps left' : '') : (steps.length ? 'Every step done 🎉' : 'No steps yet');
    return '<div class="hp"><span class="e">' + esc(i.emoji || (i.kind === 'goal' ? '🎯' : '🛠️')) + '</span><span class="t"><b>' + esc(i.title) + '</b><small>' + sub + '</small></span>' +
      (n ? '<button class="tick" data-step="' + n.id + '">Done ✓</button>' : '') + '</div>';
  }).join('') : '<div class="empty">No projects yet. Add one below.</div>') +
    (ideas ? '<div class="empty">💡 ' + ideas + (ideas === 1 ? ' idea' : ' ideas') + ' on the board</div>' : '');
  [].forEach.call($('kinds').children, function (b) { b.classList.toggle('on', b.dataset.k === HKIND); });
  $('houseitem').placeholder = HKIND === 'idea' ? 'Add an idea' : HKIND === 'goal' ? 'Add a goal' : 'Add a project';
}

function draw() {
  drawHouse();
  var show = Object.assign({}, DEFAULTS, (BOARD.kitchen && BOARD.kitchen.show) || {});
  $('tiles').innerHTML = PARTS.map(function (p) {
    return '<button class="tile' + (show[p[0]] ? ' on' : '') + '" data-k="' + p[0] + '"><span class="e">' + p[1] + '</span><span><b>' + p[2] + '</b><small>' + p[3] + '</small></span></button>';
  }).join('');
  if (document.activeElement !== $('note')) $('note').value = (BOARD.kitchen && BOARD.kitchen.note) || '';
  count();
  var list = (BOARD.items || []).filter(function (i) { return i.kind === 'list'; })
    .sort(function (a, b) { return (!!a.done_at) - (!!b.done_at); });
  $('list').innerHTML = list.length ? list.map(function (i) {
    return '<li class="' + (i.done_at ? 'done' : '') + '" data-id="' + i.id + '"><span class="box">' + (i.done_at ? '✓' : '') + '</span><span class="t">' + esc(i.title) + '</span><button class="x" data-x="1" aria-label="Remove">×</button></li>';
  }).join('') : '<li class="empty">Nothing on the list.</li>';
  $('clearDone').classList.toggle('hidden', !list.some(function (i) { return i.done_at; }));
  var people = BOARD.people || [];
  $('who').innerHTML = people.map(function (p) { return '<button class="' + (p === WHO ? 'on' : '') + '">' + esc(p) + '</button>'; }).join('');
  $('who').previousElementSibling.classList.toggle('hidden', !people.length);
}
function count() { var n = $('note').value.length; $('count').textContent = n > 200 ? (280 - n) + ' left' : ''; }

$('tiles').addEventListener('click', function (e) {
  var b = e.target.closest('.tile'); if (!b) return;
  var on = !b.classList.contains('on'), s = {}; s[b.dataset.k] = on;
  b.classList.toggle('on', on);
  edit('settings', { show: s }).then(function () { toast(on ? 'On the screen' : 'Off the screen'); });
});
$('savenote').addEventListener('click', function () {
  var t = $('note').value.trim(); if (!t) return toast('Write something first');
  $('note').blur();
  edit('settings', { note: t }).then(function () { toast('It\'s up 📌'); });
});
$('clearnote').addEventListener('click', function () { $('note').value = ''; edit('settings', { note: '' }).then(function () { toast('Note taken down'); }); });
$('note').addEventListener('input', count);
$('addform').addEventListener('submit', function (e) {
  e.preventDefault();
  var t = $('additem').value.trim(); if (!t) return;
  $('additem').value = '';
  edit('add_item', { kind: 'list', title: t }).catch(function () { $('additem').value = t; });
});
$('list').addEventListener('click', function (e) {
  var li = e.target.closest('li[data-id]'); if (!li) return;
  if (e.target.closest('[data-x]')) return edit('remove_item', { id: li.dataset.id }).then(function () { toast('Removed'); });
  edit('done_item', { id: li.dataset.id, done: !li.classList.contains('done') });
});
$('clearDone').addEventListener('click', function () {
  var done = (BOARD.items || []).filter(function (i) { return i.kind === 'list' && i.done_at; });
  done.reduce(function (p, i) { return p.then(function () { return edit('remove_item', { id: i.id }); }); }, Promise.resolve()).then(function () { toast('Cleared'); });
});
$('house').addEventListener('click', function (e) {
  var b = e.target.closest('[data-step]'); if (!b) return;
  b.disabled = true;
  houseEdit('done_step', { id: b.dataset.step, done: true }).then(function () { toast('Nice, step done 🎉'); });
});
$('kinds').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; HKIND = b.dataset.k; drawHouse(); });
$('houseform').addEventListener('submit', function (e) {
  e.preventDefault();
  var t = $('houseitem').value.trim(); if (!t) return;
  $('houseitem').value = '';
  houseEdit('add_item', { kind: HKIND, title: t }).then(function () {
    toast(HKIND === 'idea' ? 'Idea added 💡' : 'Added. Open the house board to give it steps.');
  }).catch(function () { $('houseitem').value = t; });
});
$('who').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; WHO = b.textContent; store('kitchen-who', WHO); draw(); });

function start() {
  WHO = store('kitchen-who') || '';
  $('fullboard').href = '/home/projects/?' + (PREVIEW ? 'preview=1' : 'k=' + encodeURIComponent(KEY));
  if (PREVIEW) $('sub').textContent = 'Preview: try anything, nothing is saved.';
  call('kitchen_board', { k: KEY }).then(function (b) {
    if (!b || !b.can_edit) throw new Error();
    BOARD = b; $('app').classList.remove('hidden'); draw();
  }).catch(function () { $('bad').classList.remove('hidden'); });
}
// Pick up changes made from the other phone.
setInterval(function () { if (BOARD && !PREVIEW && document.visibilityState === 'visible' && document.activeElement !== $('note') && document.activeElement !== $('additem') && document.activeElement !== $('houseitem'))
  call('kitchen_board', { k: KEY }).then(function (b) { if (b) { BOARD = b; draw(); } }).catch(function () {}); }, 30000);

// ?preview=1: a made-up kitchen, changed in memory only.
var DEMO = { can_edit: true, people: ['Sam', 'Lindsey'], kitchen: { note: 'Pizza night! Picking up at 6.', show: {} },
  items: [{ id: 'p1', kind: 'project', emoji: '🏡', title: 'Redo the front porch', steps: [{ id: 's1', title: 'Pick a stain color', done_at: new Date().toISOString() }, { id: 's2', title: 'Buy supplies' }, { id: 's3', title: 'Power wash' }] },
    { id: 'i1', kind: 'idea', title: 'Herb garden by the back door' },
    { id: 'a', kind: 'list', title: 'Milk' }, { id: 'b', kind: 'list', title: 'Dog food' }, { id: 'c', kind: 'list', title: 'Call the vet', done_at: new Date().toISOString() }] };
function fake(fn, b) {
  if (fn === 'kitchen_edit') {
    var a = b.args, it = function (id) { return DEMO.items.filter(function (i) { return i.id === id; })[0]; };
    if (b.op === 'settings') { if (a.show) DEMO.kitchen.show = Object.assign({}, DEMO.kitchen.show, a.show); if ('note' in a) DEMO.kitchen.note = a.note; }
    else if (b.op === 'add_item') DEMO.items.push({ id: 'n' + Date.now(), kind: 'list', title: a.title });
    else if (b.op === 'done_item') it(a.id).done_at = a.done ? new Date().toISOString() : null;
    else if (b.op === 'remove_item') DEMO.items = DEMO.items.filter(function (i) { return i.id !== a.id; });
  }
  return JSON.parse(JSON.stringify(DEMO));
}
function fakeHouse(op, a) {
  if (op === 'done_step') DEMO.items.forEach(function (i) { (i.steps || []).forEach(function (s) { if (s.id === a.id) s.done_at = new Date().toISOString(); }); });
  else if (op === 'add_item') DEMO.items.push({ id: 'n' + Date.now(), kind: a.kind, title: a.title, steps: [] });
  BOARD = JSON.parse(JSON.stringify(DEMO));
}
start();
</script>
</body>
</html>

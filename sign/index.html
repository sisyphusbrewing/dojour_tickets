<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Draw on the Sign · Sisyphus</title>
  <meta name="description" content="Tell the LED sign at Sisyphus what to draw. It draws it, staff OK it, and it goes up in the taproom.">
  <meta name="theme-color" content="#2b2929">
  <link rel="icon" type="image/png" href="../brewing/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../advance/advance.css">
  <script src="art.js"></script>
  <style>
    .post { margin-top: 22px; }
    .post h1 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 38px; line-height: 1; margin: 6px 0 12px; }
    .post p { color: #d9d6d6; font-size: 17px; margin: 0 0 12px; }
    .ideas { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
    .ideas button { border: 1px solid var(--line); background: transparent; color: #d9d6d6; border-radius: 999px; padding: 7px 12px; font: 600 14px var(--body); cursor: pointer; }
    canvas { width: 100%; aspect-ratio: 2 / 1; border-radius: 10px; display: block; background: #050505; }
    .result { margin-top: 18px; }
    .result p { margin: 12px 0 0; color: #d9d6d6; font-size: 17px; }
    .drawing { text-align: center; color: var(--slate-light); font-family: var(--head); text-transform: uppercase; letter-spacing: .12em; padding: 28px 0; }
    .drawing span { display: inline-block; animation: push 1.2s ease-in-out infinite; }
    @keyframes push { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
  </style>
</head>
<body>
  <header>
    <div class="wrap hdr">
      <a class="hdr-brand" href="https://www.sisyphusbrewing.com" style="text-decoration:none;color:inherit">
        <img src="../posters/assets/sisyphus-badge-dark-bg.png" alt="">
        <div class="hdr-title">The Sign<small>Sisyphus · Minneapolis</small></div>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="post">
      <h1>Draw on the sign</h1>
      <p>Tell the sign what to draw. It draws it right here and puts it up on the sign in the taproom. Keep it fun: nothing political or nude.</p>
    </section>

    <form class="card" id="form">
      <div class="field">
        <label for="prompt">What should it draw?</label>
        <input class="input" id="prompt" maxlength="100" placeholder="A moose drinking a stout" autocomplete="off">
      </div>
      <div class="ideas" id="ideas"></div>
      <div class="field">
        <label for="photo">Or send a photo <span class="help">(your dog, your table, anything: it gets turned into a picture)</span></label>
        <input class="input" id="photo" type="file" accept="image/*">
        <img id="photoPrev" alt="" class="hidden" style="max-width:120px;border-radius:8px;margin-top:8px;display:block">
      </div>
      <div class="field">
        <label for="name">Your name <span class="help">(it goes on the sign: "by Jake")</span></label>
        <input class="input" id="name" maxlength="18" required autocomplete="given-name" placeholder="Jake">
      </div>
      <div class="err hidden" id="err" style="margin-top:10px"></div>
      <button class="btn btn-primary" id="go" type="submit" style="width:100%;margin-top:14px">Draw it</button>
    </form>

    <div class="result hidden" id="result">
      <canvas id="art"></canvas>
      <p id="msg"></p>
      <button class="btn" id="again" type="button" style="width:100%;margin-top:14px">Draw something else</button>
    </div>
  </main>

  <script>
    // Each phone keeps its own random id, so the "5 an hour" limit counts
    // phones, not the bar's Wi-Fi (everyone at the bar shares one internet
    // address; Sam, Nov 12 2026).
    function phoneId() {
      try {
        var id = localStorage.getItem('signPhone');
        if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('signPhone', id); }
        return id;
      } catch (e) { return ''; }
    }
  (function () {
    'use strict';
    var FN = 'https://idsdwkubqnavkazlteis.supabase.co/functions/v1/sign-art';
    var STATUS = 'https://idsdwkubqnavkazlteis.supabase.co/rest/v1/rpc/sign_status';
    var PUBLIC_KEY = 'sb_publishable_c77Jm5yL_nrOJmxxNe-_pg_mkvDHpJb';  // the same public key the sign uses
    var waiting = 0;  // which drawing this page is waiting on
    var IDEAS = ['A moose drinking a stout', 'Sisyphus on a skateboard', 'A loon in sunglasses', 'Pizza with a mustache', 'My dog Biscuit'];
    var $ = function (id) { return document.getElementById(id); };

    $('ideas').innerHTML = IDEAS.map(function (i) { return '<button type="button">' + i + '</button>'; }).join('');
    $('ideas').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { $('prompt').value = b.textContent; $('prompt').focus(); } });

    // A photo is shrunk on the phone to about 512 px before it's sent; it goes to
    // Claude to draw from and is never saved (Sam, Nov 12 2026).
    var photo = '';
    $('photo').addEventListener('change', function () {
      photo = ''; $('photoPrev').classList.add('hidden');
      var f = $('photo').files[0]; if (!f) return;
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var k = Math.min(1, 512 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        photo = c.toDataURL('image/jpeg', 0.85);
        $('photoPrev').src = photo; $('photoPrev').classList.remove('hidden');
        URL.revokeObjectURL(url);
      };
      img.onerror = function () { $('err').textContent = "That photo couldn't be opened. Try another."; $('err').classList.remove('hidden'); };
      img.src = url;
    });

    function busy(on) {
      $('go').disabled = on;
      $('go').innerHTML = on ? '<span class="drawing" style="padding:0"><span>Drawing</span></span>' : 'Draw it';
    }

    $('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      $('err').classList.add('hidden');
      if ($('prompt').value.trim().length < 2 && !photo) {
        $('err').textContent = 'Tell the sign what to draw, or send a photo.'; $('err').classList.remove('hidden'); return;
      }
      busy(true);
      try {
        var r = await fetch(FN, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: $('prompt').value, name: $('name').value, image: photo || undefined, phone: phoneId() })
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Something went wrong.');
        $('form').classList.add('hidden');
        $('result').classList.remove('hidden');
        if (data.status === 'drawing') {
          // Drawn in the background (Sam, Nov 12 2026): no need to wait here.
          $('art').classList.add('hidden');
          $('msg').innerHTML = '<span class="drawing" style="padding:0"><span>Drawing</span></span><br>' +
            "Got it! It goes up on the sign by itself in about a minute, so you can put your phone away. Keep this open if you want to see it here first.";
          watch(data.id);
        } else show(data);
      } catch (err) {
        $('err').textContent = err.message || 'Could not reach the sign. Try again in a minute.';
        $('err').classList.remove('hidden');
      } finally { busy(false); }
    });

    function show(data) {
      if (data.status === 'rejected') {
        $('art').classList.add('hidden');
        $('msg').textContent = "The sign won't draw that one" + (data.note ? ': ' + data.note.replace(/\.$/, '') : '') + '. Try something else?';
      } else {
        $('art').classList.remove('hidden');
        drawSignArt($('art'), data.art, 64);
        $('msg').textContent = data.tamed
          ? "Here's your picture, toned down a touch for the wall. Look for it on the sign in the taproom."
          : "Here's your picture. Look for it on the sign in the taproom.";
      }
    }

    // Asks every few seconds whether the drawing is done, for up to 4 minutes.
    function watch(id) {
      waiting = id;
      var tries = 0;
      (function ask() {
        if (waiting !== id) return;
        setTimeout(async function () {
          if (waiting !== id) return;
          try {
            var r = await fetch(STATUS, {
              method: 'POST', headers: { 'Content-Type': 'application/json', apikey: PUBLIC_KEY },
              body: JSON.stringify({ p_id: id })
            });
            var data = await r.json();
            if (data && (data.status === 'approved' || data.status === 'rejected')) { waiting = 0; show(data); return; }
          } catch (e) { /* phone went to sleep or lost signal: keep asking */ }
          if (++tries < 60) ask();
          else $('msg').textContent = "It's taking a while. It'll still go up on the sign by itself when it's done.";
        }, 4000);
      })();
    }

    $('again').addEventListener('click', function () {
      waiting = 0;
      $('result').classList.add('hidden'); $('form').classList.remove('hidden');
      $('prompt').value = ''; $('photo').value = ''; photo = ''; $('photoPrev').classList.add('hidden'); $('prompt').focus();
    });
  })();
  </script>
</body>
</html>

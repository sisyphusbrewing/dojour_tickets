; The Boulder: the gift card station at the front bar (Sam, Nov 18 2026).
; Board: Waveshare ESP32-S3-Touch-LCD-4.3 (800x480 touch screen, 16 MB flash,
; 8 MB PSRAM). Card reader: PN532, wired in serial (HSU) mode.
;
; Build and flash:  pio run -t upload    (from this folder, with the board's
; USB-C socket marked UART plugged into the computer)
; Before the first build copy include/secrets.example.h to include/secrets.h
; and fill in the club wifi. That file is never committed.

[env:boulder]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; ARDUINO_USB_CDC_ON_BOOT=0: the chip's built-in USB is switched off, because
; the USB socket's two data pins are the card reader's wires (see config.h).
; Start-up messages come out of the socket marked UART instead.
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I ${PROJECT_INCLUDE_DIR}
lib_deps =
  lvgl/lvgl@8.4.0
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit NeoPixel@^1.12.3

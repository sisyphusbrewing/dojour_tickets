<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sisyphus Batch Log</title>
  <meta name="description" content="Brew log for Sisyphus: batches, recipes, tanks, brew and keg dates.">
  <meta name="theme-color" content="#2b2929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Batches">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2b2929;        /* charcoal board background */
      --card: #393636;      /* logo charcoal */
      --line: #4a4646;
      --slate: #4a6c86;     /* logo slate blue */
      --slate-dark: #3b586e;
      --slate-light: #a9c3d8;
      --gray: #918f90;
      --white: #ffffff;
      --danger: #c96a5a;
      --ok: #7fb58a;
      --head: 'Josefin Sans', 'Century Gothic', Futura, sans-serif;
      --body: 'Assistant', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--white); }
    body { font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
           padding-bottom: env(safe-area-inset-bottom); }
    a { color: var(--slate-light); }
    button, input, select, textarea { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* ---------- header ---------- */
    header { position: sticky; top: 0; z-index: 20; background: rgba(43,41,41,.96); backdrop-filter: blur(8px);
             border-bottom: 1px solid var(--line); padding: 10px 16px 0; padding-top: calc(10px + env(safe-area-inset-top)); }
    .wrap { max-width: 680px; margin: 0 auto; }
    .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hdr-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hdr-brand img { height: 40px; width: auto; display: block; }
    .hdr-title { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 15px; line-height: 1; padding-top: 3px; }
    .hdr-title small { display: block; font-family: var(--body); font-weight: 600; text-transform: none; letter-spacing: .02em; color: var(--slate-light); font-size: 12px; margin-top: 4px; }
    .tabs { display: flex; gap: 4px; margin-top: 10px; }
    .tab { flex: 1; min-height: 40px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--gray); cursor: pointer;
           font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; padding-top: 4px; }
    .tab.on { color: var(--white); border-bottom-color: var(--slate); }

    /* ---------- buttons ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px;
           border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--white); cursor: pointer;
           font-weight: 600; white-space: nowrap; transition: transform .08s, background .12s; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--slate); border-color: var(--slate); }
    .btn-primary:hover { background: var(--slate-dark); }
    .btn-ghost { background: transparent; }
    .btn-danger { color: #f0b7ac; border-color: #6b4a44; background: transparent; }
    .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 8px; }
    .btn-link { background: none; border: 0; padding: 8px 0; color: var(--slate-light); font-weight: 600; cursor: pointer; min-height: 44px; }

    /* ---------- slanted logo band heading ---------- */
    .band-wrap { margin: 28px 0 14px; padding: 8px 0; overflow: visible; }
    .band { display: inline-block; background: var(--slate); color: #fff; padding: 8px 16px 5px;
            font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 14px;
            transform: rotate(-1.5deg);
            box-shadow: 0 -4px 0 -1px var(--bg), 0 -6px 0 -1px #fff, 0 4px 0 -1px var(--bg), 0 6px 0 -1px #fff; }
    .band-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* ---------- forms ---------- */
    .field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--slate-light); margin-bottom: 4px; }
    .input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--bg); color: var(--white); outline: none; -webkit-appearance: none; appearance: none; }
    .input:focus { border-color: var(--slate-light); }
    .input::placeholder { color: #7a7677; }
    select.input { background-image: linear-gradient(45deg, transparent 50%, var(--gray) 50%), linear-gradient(135deg, var(--gray) 50%, transparent 50%);
                   background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
    textarea.input { min-height: 88px; resize: vertical; }
    input[type=date].input, input[type=datetime-local].input { color-scheme: dark; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid .span2 { grid-column: 1 / -1; }
    .grid .full { grid-column: 1 / -1; }
    @media (min-width: 560px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-3 .span2 { grid-column: span 2; } }
    .row { display: flex; gap: 8px; align-items: center; }
    .inline-unit { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
    .readonly { display: flex; align-items: center; color: var(--slate-light); }

    /* ---------- cards ---------- */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .batch { display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 10px; color: inherit; }
    .batch:hover { border-color: var(--gray); }
    .batch-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .batch-name { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 17px; line-height: 1.15; padding-top: 2px; }
    .batch-sub { color: var(--slate-light); font-size: 14px; margin-top: 3px; }
    .batch-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; color: #d9d6d6; }
    .batch-meta b { color: var(--white); font-weight: 600; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 5px 9px 4px;
            border-radius: 999px; border: 1px solid var(--line); color: var(--slate-light); white-space: nowrap; font-family: var(--head); }
    .pill.fermenting, .pill.brewing, .pill.conditioning { background: var(--slate); border-color: var(--slate); color: #fff; }
    .pill.kegged { background: #fff; color: var(--card); border-color: #fff; }
    .pill.on_tap { background: var(--ok); color: #1d2a20; border-color: var(--ok); }
    .pill.finished, .pill.dumped { color: var(--gray); }

    /* ---------- tanks strip ---------- */
    .tanks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 6px; }
    @media (min-width: 560px) { .tanks { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .tank { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 58px; text-align: left; background: transparent; color: inherit; cursor: default; }
    .tank.full { background: var(--card); border-color: var(--slate); cursor: pointer; }
    .tank .tn { font-family: var(--head); font-weight: 700; letter-spacing: .08em; font-size: 12px; color: var(--slate-light); text-transform: uppercase; }
    .tank .tb { font-weight: 600; font-size: 13px; line-height: 1.2; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tank .td { font-size: 12px; color: var(--gray); }
    .tank.empty .tb { color: var(--gray); font-weight: 400; }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; gap: 8px; align-items: center; margin: 16px 0 12px; }
    .toolbar .input { flex: 1; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: #d9d6d6; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--slate); border-color: var(--slate); color: #fff; }
    .empty { text-align: center; color: var(--gray); padding: 40px 16px; }
    .empty b { display: block; color: var(--white); font-family: var(--head); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }

    /* ---------- detail ---------- */
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .detail-title { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 24px; line-height: 1.1; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
    .list-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .list-row:last-child { border-bottom: 0; }
    .list-row .main { font-weight: 600; }
    .list-row .sub { color: var(--slate-light); font-size: 13px; }
    .list-row .amt { font-weight: 700; font-family: var(--head); white-space: nowrap; }
    .cat { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--gray); margin: 14px 0 2px; }
    .cat:first-child { margin-top: 0; }
    .x { background: none; border: 0; color: var(--gray); min-width: 36px; min-height: 36px; cursor: pointer; font-size: 18px; border-radius: 8px; }
    .x:hover { color: #f0b7ac; background: rgba(255,255,255,.04); }
    .add-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .stat { color: var(--slate-light); font-size: 13px; }
    .stat b { color: var(--white); font-size: 15px; }
    .saved { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
             background: var(--slate); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; pointer-events: none;
             transition: opacity .2s, transform .2s; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .saved.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .saved.err { background: var(--danger); }
    .danger-zone { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin: 24px 0 40px; }
    .from-recipe { font-size: 14px; color: var(--slate-light); margin-top: 6px; }

    /* ---------- sign-in ---------- */
    #lock { position: fixed; inset: 0; z-index: 100; background: rgba(43,41,41,.97); display: flex; align-items: center; justify-content: center; padding: 16px; }
    #lock .card { width: 100%; max-width: 380px; }
    #lock img { height: 120px; display: block; margin: 4px auto 8px; }
    #lock h2 { font-family: var(--head); text-transform: uppercase; letter-spacing: .12em; font-size: 15px; text-align: center; margin: 0 0 4px; }
    #lock p { color: var(--slate-light); font-size: 13px; text-align: center; margin: 0 0 16px; }
    #lock .field { margin-bottom: 12px; }
    #loginError { color: #f0b7ac; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 8px; }

    /* ---------- modal ---------- */
    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
    @media (min-width: 560px) { .modal { align-items: center; } }
    .modal .card { width: 100%; max-width: 480px; padding: 18px; }
    .modal h3 { font-family: var(--head); text-transform: uppercase; letter-spacing: .1em; font-size: 15px; margin: 0 0 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    main { padding: 0 16px 48px; }

    /* ---------- recipe card (reads like the e-mailed recipes) ---------- */
    .rcard { background: #fff; color: #222; border: 0; border-radius: 6px; padding: 22px 22px 18px; margin-top: 16px;
             font-family: var(--body); font-size: 17px; line-height: 1.35; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    .rcard h2 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 22px; margin: 0; color: #222; }
    .rcard .rc-sub { color: #4a6c86; font-size: 14px; font-weight: 600; margin: 3px 0 0; }
    .rcard .rc-block { margin-top: 14px; }
    .rcard .rc-block div { padding: 1px 0; }
    .rcard .rc-label { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: #918f90; margin-bottom: 2px; }
    .rcard .rc-notes { white-space: pre-wrap; font-size: 15px; color: #393636; }
    .rcard .rc-src { margin-top: 16px; font-size: 12px; color: #918f90; }
    .rcard .rc-empty { color: #918f90; font-style: italic; }
    .rcard-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 10px; }
    /* ---------- grain order ---------- */
    .plan-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .plan-row:last-child { border-bottom: 0; }
    .plan-row a { color: var(--white); font-weight: 600; text-decoration: none; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 18px; }
    .stepper span { min-width: 22px; text-align: center; font-family: var(--head); font-weight: 700; }
    .g-head, .g-row { display: grid; grid-template-columns: 1fr 64px 76px 78px; gap: 8px; align-items: center; }
    .g-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--slate-light); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .g-head span:not(:first-child), .g-row .n { text-align: right; }
    .g-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
    .g-row:last-child { border-bottom: 0; }
    .g-row .main { font-weight: 600; }
    .g-row .sub { color: var(--gray); font-size: 12px; line-height: 1.25; }
    .g-row .n { font-family: var(--head); font-weight: 700; white-space: nowrap; }
    .g-row .order { color: var(--slate-light); }
    .g-row .order.zero { color: var(--gray); font-weight: 400; }
    .g-row input { width: 100%; min-height: 36px; padding: 6px 8px; text-align: right; border-radius: 8px; }
    .g-note { color: var(--gray); font-size: 13px; margin-top: 10px; }
    @media print {
      body.print-grain #viewGrain { display: block !important; }
      body.print-grain .no-print, body.print-grain #viewRecipe { display: none !important; }
      body.print-grain .card { background: #fff; color: #222; border: 0; padding: 0; }
      body.print-grain .band { background: #fff; color: #222; box-shadow: none; padding: 0; transform: none; }
      body.print-grain .g-row input { border: 0; background: #fff; color: #222; }
      body.print-grain .g-row .sub, body.print-grain .g-head { color: #555; }

      body { background: #fff !important; }
      header, #lock, .btn-link, .detail-head, .rcard-actions, #rEdit, .saved, .modal, #viewList, #viewDetail, #viewRecipes { display: none !important; }
      main { padding: 0; max-width: none; }
      .rcard { box-shadow: none; padding: 0; font-size: 14pt; }
    }
  </style>
</head>
<body>

  <!-- Sign in: the same staff account as the door check-in app -->
  <div id="lock">
    <div class="card">
      <img src="../posters/assets/sisyphus-badge-dark-bg.png" alt="Sisyphus">
      <h2>Batch Log</h2>
      <p>Sign in with your staff account.</p>
      <form id="loginForm" autocomplete="on">
        <div class="field"><label for="email">Email</label>
          <input class="input" id="email" type="email" required autocomplete="email" placeholder="you@sisyphusbrewing.com"></div>
        <div class="field"><label for="password">Password</label>
          <input class="input" id="password" type="password" required autocomplete="current-password" placeholder="••••••••••"></div>
        <div id="loginError"></div>
        <button class="btn btn-primary" id="loginBtn" type="submit" style="width:100%">Sign in</button>
      </form>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="hdr">
        <a class="hdr-brand" href="#/" style="text-decoration:none;color:inherit">
          <img src="../posters/assets/sisyphus-badge-dark-bg.png" alt="">
          <div class="hdr-title">Batch Log<small id="hdrSub">Sisyphus brewhouse</small></div>
        </a>
        <button class="btn btn-sm btn-ghost" id="signOut" type="button">Sign out</button>
      </div>
      <nav class="tabs">
        <button class="tab on" data-tab="batches" type="button">Batches</button>
        <button class="tab" data-tab="recipes" type="button">Recipes</button>
        <button class="tab" data-tab="grain" type="button">Order</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- ===== batches list ===== -->
    <section id="viewList">
      <div class="tanks" id="tanks"></div>
      <div class="toolbar">
        <input class="input" id="search" type="search" placeholder="Search beer, style, batch #" autocomplete="off">
        <button class="btn btn-primary" id="newBatchBtn" type="button">+ New batch</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip on" data-filter="active" type="button">In the brewhouse</button>
        <button class="chip" data-filter="on_tap" type="button">On tap</button>
        <button class="chip" data-filter="planned" type="button">Planned</button>
        <button class="chip" data-filter="all" type="button">All batches</button>
      </div>
      <div id="batchList"></div>
    </section>

    <!-- ===== batch detail ===== -->
    <section id="viewDetail" class="hidden">
      <button class="btn-link" id="backBtn" type="button">‹ All batches</button>
      <div class="detail-head">
        <div>
          <div class="detail-title" id="dTitle"></div>
          <div class="batch-sub" id="dSub"></div>
          <div class="from-recipe hidden" id="dRecipe"></div>
        </div>
        <span class="pill" id="dPill"></span>
      </div>
      <div class="quick" id="quick">
        <button class="btn btn-sm" data-quick="brewed" type="button">Brewed today</button>
        <button class="btn btn-sm" data-quick="kegged" type="button">Kegged off today</button>
        <button class="btn btn-sm" data-quick="on_tap" type="button">On tap</button>
        <button class="btn btn-sm" data-quick="finished" type="button">Finished</button>
      </div>

      <div class="band-wrap"><span class="band">Batch</span></div>
      <form id="batchForm" class="card" autocomplete="off">
        <div class="grid grid-3">
          <div class="field span2"><label>Beer name</label><input class="input" name="beer_name" required></div>
          <div class="field"><label>Batch #</label><input class="input" name="batch_number" placeholder="26-041"></div>
          <div class="field"><label>Style</label><input class="input" name="style" placeholder="West Coast IPA"></div>
          <div class="field"><label>Tank</label><select class="input" name="fermenter"></select></div>
          <div class="field"><label>Status</label>
            <select class="input" name="status">
              <option value="planned">Planned</option>
              <option value="brewing">Brew day</option>
              <option value="fermenting">Fermenting</option>
              <option value="conditioning">Conditioning</option>
              <option value="kegged">Kegged</option>
              <option value="on_tap">On tap</option>
              <option value="finished">Finished</option>
              <option value="dumped">Dumped</option>
            </select></div>
          <div class="field"><label>Date brewed</label><input class="input" type="date" name="brew_date"></div>
          <div class="field"><label>Date kegged off</label><input class="input" type="date" name="kegged_date"></div>
          <div class="field"><label>Volume</label>
            <div class="inline-unit">
              <input class="input" type="number" step="0.01" min="0" inputmode="decimal" name="volume" placeholder="7">
              <select class="input" name="volume_unit"><option>bbl</option><option>gal</option><option>L</option><option>hL</option></select>
            </div></div>
          <div class="field"><label>OG</label><input class="input" type="number" step="0.001" min="0.9" max="1.3" inputmode="decimal" name="og" placeholder="1.062"></div>
          <div class="field"><label>FG</label><input class="input" type="number" step="0.001" min="0.9" max="1.3" inputmode="decimal" name="fg" placeholder="1.012"></div>
          <div class="field"><label>ABV</label><div class="input readonly" id="dAbv">—</div></div>
          <div class="field"><label>Kegs filled</label><input class="input" type="number" step="1" min="0" inputmode="numeric" name="keg_count"></div>
          <div class="field full"><label>Notes</label><textarea class="input" name="notes" placeholder="Mash temp, boil length, yeast pitch, anything worth remembering next time."></textarea></div>
        </div>
      </form>

      <div class="band-wrap band-row"><span class="band">Ingredients</span><span class="stat" id="ingStat"></span></div>
      <div class="card">
        <div id="ingList"></div>
        <form id="ingForm" class="add-form grid grid-3" autocomplete="off">
          <div class="field"><label>Type</label>
            <select class="input" name="category">
              <option value="grain">Grain</option><option value="hops">Hops</option><option value="yeast">Yeast</option>
              <option value="adjunct">Adjunct</option><option value="water">Water</option><option value="other">Other</option>
            </select></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    'use strict';
    // Same Supabase project and staff sign-in as the door check-in app (../index.html).
    var SUPABASE_URL = "https://idsdwkubqnavkazlteis.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc2R3a3VicW5hdmthemx0ZWlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTA2MTMsImV4cCI6MjEwNTY2NjYxM30.EUnNEOHYlNup7nBFvs--pCiyis-NYPiL_TeoiMEjDRQ";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { realtime: { params: { eventsPerSecond: 1 } } });

    var STATUS = { planned: 'Planned', brewing: 'Brew day', fermenting: 'Fermenting', conditioning: 'Conditioning',
                   kegged: 'Kegged', on_tap: 'On tap', finished: 'Finished', dumped: 'Dumped' };
    var ACTIVE = ['brewing', 'fermenting', 'conditioning', 'kegged'];
    var IN_TANK = ['brewing', 'fermenting', 'conditioning'];
    var CATS = ['grain', 'hops', 'yeast', 'adjunct', 'water', 'other'];
    var CAT_LABEL = { grain: 'Grain', hops: 'Hops', yeast: 'Yeast', adjunct: 'Adjuncts', water: 'Water', other: 'Other' };

    var batches = [], recipes = [], tanks = [], recipeCounts = {};
    var current = null;          // batch being viewed
    var currentRecipe = null;    // recipe being viewed
    var logs = [];
    var filter = 'active', search = '', rSearch = '';

    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function parseDate(s) { if (!s) return null; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function fmtDate(s) { var d = parseDate(s); if (!d) return ''; return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); }
    function daysBetween(a, b) { var da = parseDate(a), db = b ? parseDate(b) : new Date(); if (!da) return null; db.setHours(0,0,0,0); da.setHours(0,0,0,0); return Math.round((db - da) / 86400000); }
    function fmtNum(n) { if (n == null || n === '') return ''; var x = Number(n); return Number.isInteger(x) ? String(x) : String(x).replace(/\.?0+$/, ''); }
    function localDT(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function abvOf(og, fg) { if (og == null || fg == null || og === '' || fg === '') return null; return Math.round((og - fg) * 131.25 * 100) / 100; }
    function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }

    var toastTimer;
    function toast(msg, isErr) {
      var t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, isErr ? 4000 : 1400);
    }
    function fail(res, what) { console.error(what, res.error); toast((what || 'Save') + ' failed: ' + (res.error.message || res.error), true); }

    /* ---------------- auth ---------------- */
    function showLock(on) { $('lock').classList.toggle('hidden', !on); }
    $('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…'; $('loginError').textContent = '';
      try {
        var res = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
        if (res.error) { $('loginError').textContent = res.error.message; return; }
        $('password').value = '';
        showLock(false); start();
      } catch (err) { $('loginError').textContent = 'Could not reach the server. Check your connection.'; }
      finally { btn.disabled = false; btn.textContent = 'Sign in'; }
    });
    $('signOut').addEventListener('click', async function () { await sb.auth.signOut(); batches = []; recipes = []; showLock(true); });

    async function boot() {
      var res = await sb.auth.getSession();
      if (res.data && res.data.session) { showLock(false); start(); } else { showLock(true); }
      sb.auth.onAuthStateChange(function (event, session) { if (event === 'SIGNED_OUT' || !session) showLock(true); });
    }

    /* ---------------- routing ---------------- */
    var started = false;
    function start() { if (started) { route(); return; } started = true; loadAll().then(route); }
    window.addEventListener('hashchange', route);
    var VIEWS = ['viewList', 'viewDetail', 'viewRecipes', 'viewRecipe', 'viewGrain'];
    function show(view, tab) {
      VIEWS.forEach(function (v) { $(v).classList.toggle('hidden', v !== view); });
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t.getAttribute('data-tab') === tab); });
      window.scrollTo(0, 0);
    }
    function route() {
      var h = location.hash || '#/';
      var m;
      if ((m = h.match(/^#\/b\/([0-9a-f-]{36})$/))) { openBatch(m[1]); return; }
      if ((m = h.match(/^#\/r\/([0-9a-f-]{36})$/))) { openRecipe(m[1]); return; }
      if (h === '#/grain') { current = null; currentRecipe = null; show('viewGrain', 'grain'); openGrain(); return; }
      if (h === '#/recipes') { current = null; currentRecipe = null; show('viewRecipes', 'recipes'); renderRecipes(); return; }
      current = null; currentRecipe = null; show('viewList', 'batches'); renderList();
    }
    document.querySelector('.tabs').addEventListener('click', function (e) {
      var t = e.target.closest('.tab'); if (!t) return;
      var tab = t.getAttribute('data-tab');
      location.hash = tab === 'recipes' ? '#/recipes' : tab === 'grain' ? '#/grain' : '#/';
    });

    async function loadAll() {
      var r = await Promise.all([
        sb.from('batches').select('*').order('brew_date', { ascending: false, nullsFirst: true }).order('created_at', { ascending: false }),
        sb.from('recipes').select('*').order('name'),
        sb.from('tanks').select('*').eq('active', true).order('sort_order'),
        sb.from('recipe_ingredients').select('recipe_id')
      ]);
      if (r[0].error) fail(r[0], 'Load'); else batches = r[0].data || [];
      if (r[1].error) fail(r[1], 'Load'); else recipes = r[1].data || [];
      if (r[2].error) fail(r[2], 'Load'); else tanks = r[2].data || [];
      recipeCounts = {};
      if (!r[3].error) (r[3].data || []).forEach(function (x) { recipeCounts[x.recipe_id] = (recipeCounts[x.recipe_id] || 0) + 1; });
      fillTankSelects();
    }

    /* ---------------- tanks ---------------- */
    function tankOptions(currentValue) {
      var names = tanks.map(function (t) { return t.name; });
      if (currentValue && names.indexOf(currentValue) < 0) names.push(currentValue);
      return '<option value="">— none —</option>' + names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    }
    function fillTankSelects() {
      $('newForm').fermenter.innerHTML = tankOptions();
      $('batchForm').fermenter.innerHTML = tankOptions();
    }
    function occupant(tankName) {
      return batches.filter(function (b) { return b.fermenter === tankName && IN_TANK.indexOf(b.status) >= 0; })
        .sort(function (a, b) { return (b.brew_date || '') < (a.brew_date || '') ? -1 : 1; })[0];
    }
    function renderTanks() {
      var el = $('tanks');
      if (!tanks.length) { el.innerHTML = ''; return; }
      el.innerHTML = tanks.map(function (t) {
        var b = occupant(t.name);
        if (!b) return '<div class="tank empty"><div class="tn">' + esc(t.name) + '</div><div class="tb">empty</div></div>';
        var d = b.brew_date ? daysBetween(b.brew_date, null) + 1 : null;
        return '<button class="tank full" type="button" data-id="' + b.id + '"><div class="tn">' + esc(t.name) + '</div>' +
          '<div class="tb">' + esc(b.beer_name) + '</div><div class="td">' + esc(STATUS[b.status]) + (d != null ? ' · day ' + d : '') + '</div></button>';
      }).join('');
    }
    $('tanks').addEventListener('click', function (e) {
      var t = e.target.closest('.tank.full'); if (t) location.hash = '#/b/' + t.getAttribute('data-id');
    });

    /* ---------------- batch list ---------------- */
    function matches(b) {
      if (filter === 'active' && ACTIVE.indexOf(b.status) < 0) return false;
      if (filter === 'on_tap' && b.status !== 'on_tap') return false;
      if (filter === 'planned' && b.status !== 'planned') return false;
      if (search) {
        var hay = [b.beer_name, b.style, b.batch_number, b.fermenter].join(' ').toLowerCase();
        if (hay.indexOf(search) < 0) return false;
      }
      return true;
    }

    function timeline(b) {
      var parts = [];
      if (b.brew_date) {
        var s = 'Brewed <b>' + esc(fmtDate(b.brew_date)) + '</b>';
        if (b.kegged_date) {
          var d = daysBetween(b.brew_date, b.kegged_date);
          s += ' → Kegged <b>' + esc(fmtDate(b.kegged_date)) + '</b>' + (d != null ? ' (' + d + ' days)' : '');
        } else if (IN_TANK.indexOf(b.status) >= 0) {
          var n = daysBetween(b.brew_date, null);
          s += ' · <b>day ' + (n + 1) + '</b>' + (b.fermenter ? ' in ' + esc(b.fermenter) : '');
        }
        parts.push('<span>' + s + '</span>');
      } else if (b.kegged_date) {
        parts.push('<span>Kegged <b>' + esc(fmtDate(b.kegged_date)) + '</b></span>');
      } else if (b.fermenter && IN_TANK.indexOf(b.status) >= 0) {
        parts.push('<span>In <b>' + esc(b.fermenter) + '</b></span>');
      }
      return parts;
    }

    // Newest brew first; planned batches (no brew date yet) sit on top. Same order the database query uses.
    function sortBatches() {
      batches.sort(function (a, b) {
        if (!a.brew_date !== !b.brew_date) return a.brew_date ? 1 : -1;
        if (a.brew_date !== b.brew_date) return a.brew_date < b.brew_date ? 1 : -1;
        return a.created_at < b.created_at ? 1 : -1;
      });
    }

    function renderList() {
      var el = $('batchList');
      sortBatches();
      renderTanks();
      var rows = batches.filter(matches);
      var inTank = batches.filter(function (b) { return IN_TANK.indexOf(b.status) >= 0; }).length;
      $('hdrSub').textContent = batches.length ? batches.length + (batches.length === 1 ? ' batch' : ' batches') + ' · ' + inTank + ' in tanks' : 'Sisyphus brewhouse';
      if (!rows.length) {
        el.innerHTML = '<div class="empty"><b>' + (batches.length ? 'Nothing here' : 'No batches yet') + '</b>' +
          (batches.length ? 'Try another filter or clear the search.' : 'Tap <em>New batch</em> to log your first brew.') + '</div>';
        return;
      }
      el.innerHTML = rows.map(function (b) {
        var meta = timeline(b);
        var bits = [];
        if (b.abv != null) bits.push('<span><b>' + fmtNum(b.abv) + '%</b> ABV</span>');
        else if (b.og != null) bits.push('<span>OG <b>' + fmtNum(b.og) + '</b></span>');
        if (b.volume != null) bits.push('<span><b>' + fmtNum(b.volume) + '</b> ' + esc(b.volume_unit) + '</span>');
        if (b.keg_count != null) bits.push('<span><b>' + b.keg_count + '</b> kegs</span>');
        var sub = [b.batch_number ? '#' + b.batch_number : null, b.style].filter(Boolean).map(esc).join(' · ');
        return '<button class="card batch" type="button" data-id="' + b.id + '">' +
          '<div class="batch-top"><div><div class="batch-name">' + esc(b.beer_name) + '</div>' +
          (sub ? '<div class="batch-sub">' + sub + '</div>' : '') + '</div>' +
          '<span class="pill ' + esc(b.status) + '">' + esc(STATUS[b.status] || b.status) + '</span></div>' +
          (meta.length || bits.length ? '<div class="batch-meta">' + meta.concat(bits).join('') + '</div>' : '') +
          '</button>';
      }).join('');
    }

    $('batchList').addEventListener('click', function (e) {
      var card = e.target.closest('.batch'); if (card) location.hash = '#/b/' + card.getAttribute('data-id');
    });

    var BAG_LB = 55;

    function maltName(raw) {
      if (maltSub(raw)) return maltSub(raw);
      var s = String(raw || '').toLowerCase().replace(/\([^)]*\)/g, ' ')
        .replace(/\b(rahr|weyermann|briess|crisp|simpsons|us)\b/g, ' ').replace(/[,/]/g, ' ').replace(/\s+/g, ' ').trim();
      var num = (s.match(/\b(\d{2,3})\s*l?\b/) || [])[1];
      if (/acid/.test(s)) return 'Acidulated Malt';
      if (/dextrin|cara[ -]?pils/.test(s)) return 'Carapils / Dextrine';
      if (/pils/.test(s)) return 'Pilsner';
      if (/roast/.test(s)) return 'Roasted Barley';
      if (/golden naked/.test(s)) return 'Golden Naked Oats';
      if (/golden promise/.test(s)) return 'Golden Promise';
      if (/maris/.test(s)) return 'Maris Otter';
      if (/2[ -]?row|^pale malt$/.test(s)) return '2-Row';
      if (/pale ale/.test(s)) return 'Pale Ale Malt';
      if (/malted oat/.test(s)) return 'Malted Oats';
      if (/flaked|^barley$/.test(s)) {
        var g = (s.match(/oat|barley|corn|rye|wheat|rice/) || ['grain'])[0];
        return 'Flaked ' + ({ oat: 'Oats' }[g] || g.charAt(0).toUpperCase() + g.slice(1));
      }
      if (/wheat/.test(s)) return 'White Wheat';
      if (/caramunich/.test(s)) return 'Caramunich I';
      if (/carafa/.test(s)) return 'Carafa III';
      if (/munich/.test(s)) return 'Munich I';
      if (/vienna/.test(s)) return 'Vienna';
      if (/chocolate/.test(s)) return /patagonia/.test(s) ? 'Chocolate (Patagonia)' : 'Chocolate';
      if (/crystal|caramel/.test(s) && num === '50' || /\bt[ -]?50\b/.test(s)) return 'Simpsons Crystal T-50';
      if (/crystal|caramel/.test(s) && num) return 'Crystal ' + num;
      if (/black/.test(s)) return 'Black Malt';
      if (/special b/.test(s)) return 'Special B';
      if (/victory|biscuit/.test(s)) return 'Victory';
      if (/^rice$/.test(s)) return 'Rice';
      return String(raw).trim();
    }
    function toLb(amount, unit) {
      if (amount == null || amount === '') return null;
      var u = String(unit || 'lb').toLowerCase(), a = Number(amount);
      if (/^bags?$/.test(u)) return a * BAG_LB;
      if (/^(lb|lbs|pound)/.test(u)) return a;
      if (u === 'oz') return a / 16;
      if (u === 'kg') return a * 2.20462;
      if (u === 'g') return a / 453.592;
      return null;

    function plural(n, w) { return n === 1 ? w : w === 'lb' ? 'lb' : w + 's'; }
    function hopName(raw) {

    function pickHop(list) {
      var best = null;
      (list || []).forEach(function (i) {
        var m = /^(\d{4})(S?)$/.exec(i.name.replace(/^.*\s/, ''));
        if (!m || i.avail <= 0) return;
        var rank = Number(m[1]) + (m[2] ? 10000 : 0);

      ]);

    function renderGrain() {
      plan.sort(function (a, b) { return byId(recipes, a.recipe_id).name.localeCompare(byId(recipes, b.recipe_id).name); });

        });
        return lines.length ? k.title + '\n' + lines.join('\n') : '';
      }).filter(Boolean);
      if (!parts.length) { toast('Nothing to order'); return; }
      var text = 'Sisyphus order\n\n' + parts.join('\n\n');
      try { await navigator.clipboard.writeText(text); toast('Order copied'); }
      catch (err) { window.prompt('Copy the order:', text); }
    });

    // Opens rahrbsg.com with the order in the cart (VTEX's /checkout/cart/add link). Sam signs in
    // there for his prices and checks out himself; nothing is ordered from here.
    $('grainRahr').addEventListener('click', async function () {
      var want = [], skip = [];
      ORDER_KINDS.forEach(function (k) {
        (orderRows[k.key] || []).forEach(function (x) {
          if (!x.packs) return;
          var r = RAHR[x.name];
          if (!r) { skip.push(x.name + ' (not on the list)'); return; }
          var size = k.unit === 'g' ? r.g : r.lb;
          want.push({ name: x.name, r: r, qty: Math.max(1, Math.ceil((x.need - x.have) / size - 1e-9)) });
        });
      });
      if (!want.length) { toast(skip.length ? 'Nothing RahrBSG carries on this order' : 'Nothing to order'); return; }
      var win = window.open('about:blank', '_blank');   // opened now so the pop-up blocker allows it
      toast('Checking RahrBSG…');
      var res = await sb.functions.invoke('rahr-catalog', { body: {
        skus: want.filter(function (w) { return w.r.sku; }).map(function (w) { return w.r.sku; }),
        slugs: want.filter(function (w) { return w.r.slug; }).map(function (w) { return w.r.slug; })
      } });
      if (res.error || !res.data) { if (win) win.close(); fail(res.error ? res : { error: 'no answer' }, 'RahrBSG lookup'); return; }
      var parts = [];
      want.forEach(function (w) {
        var id = w.r.sku, item = id ? res.data.skus[id] : pickHop(res.data.slugs[w.r.slug]);
        if (item && !id) id = item.id;
        if (!item || item.avail <= 0) { skip.push(w.name + ' (out of stock)'); return; }
        parts.push('sku=' + id + '&qty=' + w.qty + '&seller=1');
      });
      if (!parts.length) { if (win) win.close(); alert('Nothing could go in the cart:\n' + skip.join('\n')); return; }
      var url = 'https://www.rahrbsg.com/checkout/cart/add?' + parts.join('&') + '&sc=1';
      if (skip.length) alert(parts.length + ' items going in the RahrBSG cart. Add these by hand:\n' + skip.join('\n'));
      if (win) win.location.href = url; else location.href = url;
    });

    boot();
  })();
  </script>
</body>

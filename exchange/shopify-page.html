<!-- Sisyphus: body of the Shopify page "Change your tickets" (handle: exchange). Embeds
     the ticket exchange page from GitHub Pages and passes ?order=&email= through. -->
<div class="sb-advance" style="max-width:720px;margin:0 auto;">
  <iframe id="sbAdvance" title="Change your Sisyphus tickets" src="about:blank"
          style="display:block;width:100%;height:70vh;border:0;border-radius:14px;background:#2b2929;" loading="eager"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('sbAdvance');
    f.src = 'https://staff.sisyphusbrewing.com/exchange/' + window.location.search;
    window.addEventListener('message', function (e) {
      if ((e.origin !== 'https://staff.sisyphusbrewing.com' && e.origin !== 'https://sisyphusbrewing.github.io') || !e.data) return;
      if (e.data.advanceHeight) f.style.height = (e.data.advanceHeight + 16) + 'px';
    });
  })();
</script>

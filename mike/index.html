<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="The Many Careers of Mike Lester">
<meta property="og:description" content="Pizza guy. Exterminator. Golfer (bad). Retainer printer. Comedian. One rat tail through all of it.">
<title>The Many Careers of Mike Lester</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&family=Special+Elite&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
/* Mike Lester: comic, ex-pizza driver, ex-exterminator, bad golfer, now 3D-prints dental retainers. Shaved the top
   (it was leaving anyway), kept a 12-inch rat tail in back. The game is his résumé: five quick jobs, each its own
   mini-game, and the rat tail grows with every one. The last job is a set at Sisyphus, and the jokes are built
   from how the earlier jobs went.
   1 Pizza (tap lit porches) → 2 Exterminator (tap bugs, not your own hair) → 3 Golf (swing meter)
   → 4 Retainers (stack print layers) → 5 The Set (land each punchline on the beat) → résumé. */
:root {
  --paper: #fbf8ee;
  --ink: #23271f;
  --cream: #f4efe1;
  --night: #15171c;
  --orange: #ef7d22;
  --gold: #ffe7b8;
  --pencil: #3b3f8f;
  --skin: #f0c7ae;
  --tail: #8a5a2e;
  --display: "Alfa Slab One", Rockwell, Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --type: "Special Elite", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--cream); font-family: var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; container-type: size; }
.screen { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) 16px max(14px, env(safe-area-inset-bottom, 0px)); text-align: center; animation: in .4s cubic-bezier(.3,1.4,.5,1); }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
.btn { font: 400 clamp(19px, 6cqw, 25px)/1 var(--display); color: var(--ink); background: var(--orange); border: 0; border-radius: 12px; padding: 14px 24px; cursor: pointer; box-shadow: 0 6px 0 #a24f0f, 0 12px 22px rgba(0,0,0,.35); }
.btn { position: relative; z-index: 3; }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #a24f0f; }
.btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
.small { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }

/* Mike: bald dome (drawn), his face, glasses and all (photo), and the rat tail (drawn), which grows. */
.mk { position: relative; width: var(--s, 120px); aspect-ratio: 1; margin-top: calc(var(--s, 120px) * .32); flex: none; }
.mk .dome { position: absolute; left: 4%; top: -30%; width: 92%; z-index: 2; }
.mk img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--cream); background: #333; }
.mk .tail { position: absolute; left: 66%; top: 46%; width: 30%; height: calc(var(--s, 120px) * var(--len, 1)); z-index: 0; transition: height .8s cubic-bezier(.3,1.5,.5,1); overflow: visible; }

/* Title: his résumé */
#s0 { background: radial-gradient(90% 60% at 50% 30%, #2a2f38, var(--night)); }
.resume { width: 100%; max-width: 380px; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 14px 16px; text-align: left; box-shadow: 0 18px 40px rgba(0,0,0,.5); font: 400 14px/1.35 var(--type); position: relative; }
.resume h1 { margin: 0; font: 400 clamp(24px, 8cqw, 32px)/1 var(--display); }
.resume .obj { margin: 6px 0 8px; font-size: 13px; }
.resume ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.resume li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; border-top: 1px dashed #cfc7b2; padding-top: 5px; }
.resume li b { font: 700 14px/1.2 var(--body); }
.resume li .yrs { font-size: 11px; opacity: .65; }
.resume li .got { font: 700 13px/1 var(--body); color: var(--pencil); white-space: nowrap; }
.resume li.done .got { color: #1f7a3a; }
.resume li.now { background: #fff3c9; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 4px; }
.titlerow { display: flex; gap: 14px; align-items: end; justify-content: center; }
.best { font: 700 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }

/* Job intro card */
.intro { width: 100%; max-width: 380px; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 18px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.5); display: grid; gap: 8px; }
.intro .n { font: 700 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: #a24f0f; }
.intro h2 { margin: 0; font: 400 clamp(26px, 8.5cqw, 34px)/1 var(--display); }
.intro .yrs { font: 400 13px/1 var(--type); opacity: .7; }
.intro p { margin: 0; font: 400 16px/1.4 var(--body); }
.intro .how { font: 700 15px/1.35 var(--body); background: #eef3e6; border-radius: 10px; padding: 10px 12px; }
.intro .emoji { font-size: 54px; line-height: 1; }

/* The job itself */
#play { align-content: stretch; grid-template-rows: auto 1fr auto; gap: 8px; }
.hud { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: end; font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; text-align: left; }
.hud b { display: block; font: 400 22px/1 var(--display); letter-spacing: 0; margin-top: 3px; color: var(--gold); }
.hud .job b { font-size: 17px; }
.hud b.low { color: #ff8a6b; }
.field { position: relative; width: 100%; min-height: 0; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.12), 0 12px 28px rgba(0,0,0,.4); }
.field.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translate(-5px, 3px); } 50% { transform: translate(4px, -3px); } 75% { transform: translate(-2px, 2px); } }
.bar { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 64px; }
.bar .mk { --s: 50px; margin-top: 16px; }
.bubble { flex: 1; background: var(--cream); color: var(--ink); border-radius: 12px; padding: 8px 12px; font: 700 14px/1.3 var(--body); text-align: left; position: relative; min-height: 2.7em; display: flex; align-items: center; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-right-color: var(--cream); border-left: 0; }
.inches { font: 400 13px/1.1 var(--display); color: var(--gold); text-align: center; width: 54px; flex: none; }
.inches small { display: block; font: 700 9px/1.1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--cream); opacity: .7; }

.pop { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; text-align: center; white-space: nowrap; font: 400 22px/1 var(--display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.35); animation: rise .95s ease-out forwards; }
.pop.big { font-size: 30px; color: var(--gold); text-shadow: 0 3px 0 #a24f0f, 0 0 10px rgba(0,0,0,.4); }
.pop.bad { color: #ff9a7d; }
.pop small { display: block; font: 700 12px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
@keyframes rise { 0% { transform: translate(-50%, -50%) scale(.4); } 18% { transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
.fly { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 15; font-size: 30px; line-height: 1; margin: -15px 0 0 -15px; }
.sprite { position: absolute; display: grid; place-items: center; line-height: 1; pointer-events: none; transform: translate(-50%, -50%); }
.sprite.in { animation: popin .22s cubic-bezier(.3,1.8,.5,1); }
.sprite.out { animation: popout .28s ease-in forwards; }
@keyframes popin { from { transform: translate(-50%, -50%) scale(0); } }
@keyframes popout { to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
.label { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); font: 700 9px/1 var(--body); letter-spacing: .08em; background: #f3c623; color: var(--ink); padding: 2px 5px; border-radius: 3px; white-space: nowrap; }

/* 1 Pizza: a night street */
.f-pizza { background: linear-gradient(#1c2233, #263149 60%, #39404c 60%, #39404c 100%); }
.f-pizza .lane { position: absolute; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(90deg, #f3c623 0 18px, transparent 18px 36px); opacity: .5; }
.house { font-size: 46px; }
.house.lit::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(255,220,120,.55), transparent 65%); z-index: -1; }
.house .door { position: absolute; bottom: -10px; font: 700 10px/1 var(--body); color: var(--gold); }
.car { position: absolute; left: 12px; bottom: 10px; font-size: 40px; z-index: 5; pointer-events: none; transform: scaleX(-1); }
.clock { position: absolute; right: 10px; top: 10px; font: 400 14px/1 var(--display); background: #c8372d; color: #fff; padding: 6px 8px; border-radius: 6px; z-index: 5; }

/* 2 Exterminator: a kitchen floor */
.f-bug { background: repeating-conic-gradient(#e9e4d8 0 25%, #cfc8b6 0 50%) 0 0 / 56px 56px; }
.bugspr { font-size: 38px; }
.bugspr.rat { font-size: 46px; }
.hairspr svg { width: 46px; height: 80px; overflow: visible; }
.spray { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.85), rgba(200,230,255,.4) 45%, transparent 70%); pointer-events: none; z-index: 12; animation: spray .4s ease-out forwards; }
@keyframes spray { from { transform: scale(.3); } to { transform: scale(1.3); opacity: 0; } }
.splat { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; z-index: 1; }

/* 3 Golf: a driving range seen from behind */
.f-golf { background: linear-gradient(#8fd0f5 0 28%, #6bb35f 28%, #4c9446 100%); }
.yard { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.35); font: 700 10px/1 var(--body); color: rgba(255,255,255,.8); }
.yard span { position: absolute; right: 8px; top: -12px; }
.meter { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 30px; border-radius: 15px; background: #2a2f38; box-shadow: inset 0 0 0 3px #fff; overflow: hidden; z-index: 6; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: #48c26a; }
.meter .sweet { position: absolute; top: 0; bottom: 0; background: #ffe066; }
.meter .needle { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 6px #000; }
.golfmike { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 5; pointer-events: none; }
.golfball { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 7; pointer-events: none; }
.swingn { position: absolute; left: 12px; top: 10px; font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: #123; background: rgba(255,255,255,.75); padding: 5px 8px; border-radius: 6px; z-index: 6; }

/* 4 Retainers: a print bed */
.f-print { background: linear-gradient(#2a2e36, #1d2026); }
.f-print .frame { position: absolute; left: 6%; right: 6%; top: 8px; height: 10px; background: #4a505b; border-radius: 5px; }
.f-print .bed { position: absolute; left: 4%; right: 4%; bottom: 14px; height: 14px; background: repeating-linear-gradient(90deg, #6b717c 0 8px, #5b616b 8px 16px); border-radius: 3px; }
.layer { position: absolute; height: 22px; border-radius: 6px; background: linear-gradient(rgba(150,240,220,.95), rgba(90,200,180,.9)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 0 10px rgba(120,240,210,.35); }
.layer.moving { box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 0 16px rgba(120,240,210,.8); }
.layer.cut { transition: transform 1s ease-in, opacity 1s; }
.nozzle { position: absolute; width: 22px; height: 26px; margin-left: -11px; background: linear-gradient(#c9ccd0, #8f969c); clip-path: polygon(0 0, 100% 0, 100% 60%, 60% 100%, 40% 100%, 0 60%); z-index: 4; }
.teeth { position: absolute; left: 50%; transform: translateX(-50%); font-size: 40px; z-index: 3; pointer-events: none; }

/* 5 The set: Sisyphus brick */
.f-set { background: radial-gradient(55% 45% at 50% 32%, rgba(255,236,190,.3), transparent 70%), repeating-linear-gradient(0deg, #6b3a2a 0 22px, #3c2018 22px 25px), #6b3a2a; }
.setmike { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); }
.setmike .mk { --s: clamp(70px, 14cqh, 100px); }
.mic { position: absolute; left: 50%; top: calc(9% + 20px); margin-left: 32px; font-size: 30px; }
.joke { position: absolute; left: 12px; right: 12px; bottom: 96px; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: 700 16px/1.35 var(--body); text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,.35); z-index: 5; }
.joke .punch { display: block; margin-top: 6px; color: #a24f0f; }
.beat { position: absolute; left: 14px; right: 14px; bottom: 16px; height: 62px; z-index: 6; }
.beat .lbl { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; color: var(--gold); }
.beat .track { position: relative; height: 34px; border-radius: 17px; background: #1c1d22; box-shadow: inset 0 0 0 3px var(--cream); overflow: hidden; }
.beat .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #555, #888); }
.beat .pz { position: absolute; top: 0; bottom: 0; background: rgba(255,224,102,.55); }
.laughs { position: absolute; left: 12px; top: 10px; font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); z-index: 6; }
.laughs .lm { width: 90px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.4); margin-top: 5px; overflow: hidden; }
.laughs .lm div { height: 100%; width: 0; background: linear-gradient(90deg, #f3c623, #ef7d22); transition: width .5s; }

/* Between jobs */
.result { width: 100%; max-width: 380px; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.5); display: grid; gap: 8px; text-align: left; }
.result .n { font: 700 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: #a24f0f; }
.result h2 { margin: 0; font: 400 24px/1.05 var(--display); }
.result .stats { font: 400 15px/1.4 var(--type); }
.result .leave { font: 400 15px/1.35 var(--type); color: var(--pencil); border-top: 1px dashed #cfc7b2; padding-top: 8px; }
.result .grow { font: 400 18px/1 var(--display); color: #1f7a3a; }

/* Final résumé */
.final .resume { padding-bottom: 12px; margin-top: 22px; }
.stampx { position: absolute; right: -6px; top: -30px; background: var(--paper); border: 4px double #c8372d; color: #c8372d; font: 400 15px/1.05 var(--display); padding: 6px 8px; text-align: center; max-width: 46%; transform: rotate(10deg) scale(2.6); opacity: 0; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
.stampx.on { transform: rotate(10deg) scale(1); opacity: .92; }
.newbest { font: 400 17px/1 var(--display); color: var(--gold); }

@container (max-height: 700px) {
  .screen { gap: 8px; }
  .resume { font-size: 13px; padding: 12px 14px; }
  .resume li { padding-top: 3px; }
  .resume .obj { margin: 4px 0 6px; font-size: 12px; }
  .resume li .yrs { font-size: 10px; }
  .intro { padding: 14px; gap: 6px; }
  .intro p { font-size: 15px; }
  .intro .emoji { font-size: 40px; }
  .joke { font-size: 15px; bottom: 88px; }
}
@media (prefers-reduced-motion: reduce) { .screen, .sprite.in, .field.shake { animation: none; } }
</style>
</head>
<body>
<div class="stage">

  <!-- 0. The résumé (title) -->
  <section class="screen" id="s0">
    <div class="titlerow"><div class="mk" data-mk style="--s: clamp(60px, min(30cqw, 12cqh), 130px)"></div></div>
    <div class="resume" id="cv">
      <h1>MIKE LESTER</h1>
      <div class="obj">Objective: one more job. Skills: whatever this one needs. Hair: business in the back, nothing in the front.</div>
      <ol id="jobs"></ol>
    </div>
    <div class="best" id="best" hidden></div>
    <button class="btn" id="start" type="button">Clock in</button>
  </section>

  <!-- 1. Job intro -->
  <section class="screen" id="s1" hidden>
    <div class="intro">
      <div class="emoji" id="iEmoji"></div>
      <div class="n" id="iN"></div>
      <h2 id="iTitle"></h2>
      <div class="yrs" id="iYrs"></div>
      <p id="iBlurb"></p>
      <div class="how" id="iHow"></div>
    </div>
    <button class="btn" id="go" type="button">Start shift</button>
  </section>

  <!-- 2. The job -->
  <section class="screen" id="play" hidden>
    <div class="hud">
      <span class="job">Job <span id="hN">1</span>/5<b id="hJob"></b></span>
      <span><span id="hScoreL">Score</span><b id="hScore">0</b></span>
      <span><span id="hTimeL">Time</span><b id="hTime">20</b></span>
    </div>
    <div class="field" id="field"></div>
    <div class="bar"><div class="mk" data-mk id="barMk"></div><div class="bubble" id="say"></div><div class="inches"><span id="inch">12.0"</span><small>rat tail</small></div></div>
  </section>

  <!-- 3. Between jobs -->
  <section class="screen" id="s3" hidden>
    <div class="result">
      <div class="n" id="rN"></div>
      <h2 id="rTitle"></h2>
      <div class="stats" id="rStats"></div>
      <div class="leave" id="rLeave"></div>
      <div class="grow" id="rGrow"></div>
    </div>
    <div class="mk" data-mk id="resMk" style="--s: 84px"></div>
    <button class="btn" id="next" type="button">Next job</button>
  </section>

  <!-- 4. Final résumé -->
  <section class="screen final" id="s4" hidden>
    <div class="mk" data-mk style="--s: clamp(56px, 10cqh, 84px)"></div>
    <div class="resume">
      <div class="stampx" id="stamp"></div>
      <h1>MIKE LESTER</h1>
      <div class="obj" id="fObj"></div>
      <ol id="fJobs"></ol>
    </div>
    <div class="newbest" id="newbest" hidden>New personal best!</div>
    <button class="btn" id="again" type="button">Start a new life</button>
    <div class="small">Mike Lester · as seen at Sisyphus</div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const show = id => document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let ac;
  function tone(f, d = .15, type = "square", vol = .05, slide = .5, delay = 0) {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  }
  const good = () => { tone(660, .08, "triangle", .06, 1); tone(990, .12, "triangle", .05, 1, .07); };
  const bad = () => { tone(200, .2, "sawtooth", .06, .5); };
  const squish = () => { tone(180, .14, "sawtooth", .08, .35); tone(70, .12, "square", .06, .7, .03); };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- Mike ----------
  const DOME = '<svg class="dome" viewBox="0 0 100 50" aria-hidden="true"><path d="M2 50C2 18 24 2 50 2s48 16 48 48z" fill="#f0c7ae"/><path d="M2 50C2 18 24 2 50 2s48 16 48 48" fill="none" stroke="#d9a98e" stroke-width="2"/><ellipse cx="34" cy="17" rx="14" ry="6" fill="#fff" opacity=".7" transform="rotate(-22 34 17)"/><path d="M72 8l3-6M80 13l5-4M64 5l1-5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>';
  const TAIL = '<svg class="tail" viewBox="0 0 30 100" preserveAspectRatio="none" aria-hidden="true"><path d="M8 0C22 10 2 20 16 30S4 50 16 60 6 80 14 92" fill="none" stroke="#5a3a1c" stroke-width="9" stroke-linecap="round"/><path d="M8 0C22 10 2 20 16 30S4 50 16 60 6 80 14 92" fill="none" stroke="#a06a36" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M14 92l-4 8M14 92l4 8M14 92v8" stroke="#a06a36" stroke-width="2" stroke-linecap="round"/></svg>';
  function drawMike() { document.querySelectorAll("[data-mk]").forEach(el => { el.innerHTML = DOME + '<img src="face.jpg" alt="Mike Lester: shaved on top, glasses, rat tail in back">' + TAIL; }); }
  let inches = 12;
  function setTail() {
    document.querySelectorAll("[data-mk]").forEach(el => el.style.setProperty("--len", (.9 + (inches - 12) * .16).toFixed(2)));
    $("inch").textContent = inches.toFixed(1) + '"';
  }
  let sayT;

    },
    tick(dt) {
      if (this.done) { this.end -= dt; return this.end <= 0; }
      const c = this.cur; if (!c) return false;
      c.x += c.dir * c.speed * dt; if (c.x < 0) { c.x = 0; c.dir = 1; } if (c.x + c.w > fw) { c.x = fw - c.w; c.dir = -1; }
      c.el.style.left = c.x + "px";
      $("noz").style.left = (c.x + c.w / 2) + "px"; $("noz").style.top = (c.y - 28) + "px";
      return false;
    },
    finish() {
      const r = this.fail ? 0 : this.prev.w / this.startW, n = this.layers.length;
      const who = this.fail ? "nobody. It's a toothpick." : r > .8 ? "a real human mouth. Somebody's orthodontist would sign off." : r > .55 ? "a kid. A small, nervous kid." : r > .3 ? "a mouse. A very self-conscious mouse." : "a tooth. One tooth. Just the one.";
      const inch = this.fail ? .5 : r > .8 ? 3 : r > .55 ? 2 : r > .3 ? 1.2 : .7;
      return {
        stats: `Layers: ${n}/10 · Perfect layers: ${this.perfect} · Final width: ${Math.round(r * 100)}%`,
        leave: `Reason for leaving: he hasn't. This is his job now. Today's retainer fits ${who}`,
        inches: inch,
        joke: { setup: `Now I 3D print retainers. Today I printed one that fits ${this.fail ? "nobody. It's a toothpick" : r > .55 ? "a real person" : "a mouse"}.`,
                punch: "People ask, Mike, why retainers? Because you can't print hair. I checked. I checked a lot." },
      };
    },
  });

  // 5. The set at Sisyphus: one callback per job; tap when the beat meter hits the pause to land the punchline.
  JOBS.push({
    key: "set", emoji: "🎤", title: "Comedian", yrs: "Tonight · Sisyphus",
    blurb: "Every job Mike ever had was material. Tonight he uses all of it. The better the earlier jobs went, the better the jokes.",
    how: "Each joke has a setup. Wait for the pause, then tap in the yellow to land the punchline. Too early steps on it; too late, somebody coughs.",
    init() {
      field.className = "field f-set";
      field.insertAdjacentHTML("beforeend", '<div class="laughs">Laughs<div class="lm"><div id="lm"></div></div></div><div class="setmike"><div class="mk" data-mk></div></div><div class="mic">🎤</div><div class="joke" id="joke"></div><div class="beat"><div class="lbl" id="blbl">Wait for it…</div><div class="track"><div class="pz" id="pz"></div><div class="fill" id="bfill"></div></div></div>');
      drawMike(); setTail();
      this.jokes = results.map(r => r.joke); this.i = -1; this.laughs = 0; this.big = 0; this.state = "wait"; this.wait = .6;
      say("Every job I ever had was so I could stand up here and complain about it.");
      $("hScoreL").textContent = "Laughs"; hud(0, "1/4", "Joke");
    },
    nextJoke() {
      this.i++; if (this.i >= this.jokes.length) { this.state = "end"; this.wait = 1.2; return; }
      const j = this.jokes[this.i];
      $("joke").innerHTML = ""; $("joke").textContent = j.setup;
      this.pz = rnd(.58, .74); this.pw = .14;
      $("pz").style.left = this.pz * 100 + "%"; $("pz").style.width = this.pw * 100 + "%";
      this.fill = 0; this.state = "beat"; $("blbl").textContent = "Wait for the pause…";
      this.dur = 2.2 - this.i * .2;
      hud(this.laughs, `${this.i + 1}/4`);
    },
    tap() {
      if (this.state !== "beat") return;
      const f = this.fill, j = this.jokes[this.i];
      // Callback strength: the better that job went, the more the room already loves this bit.
      const strength = 1 + results[this.i].inches / 3;
      let pts, label, cls, crowd;
      if (f >= this.pz && f <= this.pz + this.pw) { pts = Math.round(30 * strength); label = "BIG LAUGH"; cls = "big"; this.big++; crowd = pick(["The bartender laughed. The bartender never laughs.", "A guy slapped the table so hard his beer jumped.", "Someone in the back yelled \"THE TAIL!\""]); [523, 659, 784].forEach((x, k) => tone(x, .12, "triangle", .06, 1, k * .07)); buzz([20, 20, 20]); }
      else if (f < this.pz) { pts = Math.round(10 * strength); label = "STEPPED ON IT"; cls = "bad"; crowd = "Rushed it. A few people laughed anyway, out of kindness."; tone(300, .1, "triangle", .05, 1); }
      else { pts = Math.round(6 * strength); label = "TOO LONG"; cls = "bad"; crowd = "Held the pause too long. Somebody coughed. Then laughed at the cough."; tone(180, .2, "triangle", .05, .7); }
      this.laughs += pts;
      $("joke").innerHTML = ""; $("joke").append(j.setup); const pu = document.createElement("span"); pu.className = "punch"; pu.textContent = j.punch; $("joke").appendChild(pu);
      pop(fw / 2, fh * .38, label, cls, `+${pts} laughs`);
      $("lm").style.width = Math.min(100, this.laughs / (4 * 60) * 100) + "%";
      say(crowd); this.state = "read"; this.wait = 3.4; hud(this.laughs);
    },
    tick(dt) {
      if (this.state === "wait" || this.state === "read") { this.wait -= dt; if (this.wait <= 0) this.nextJoke(); return false; }
      if (this.state === "end") { this.wait -= dt; return this.wait <= 0; }
      this.fill += dt / this.dur;
      $("bfill").style.width = Math.min(100, this.fill * 100) + "%";
      $("blbl").textContent = this.fill >= this.pz ? "NOW!" : "Wait for the pause…";
      if (this.fill >= 1) { this.fill = 1.01; this.tap(); }
      return false;
    },
    finish() {
      const inch = this.big >= 4 ? 3 : this.big >= 3 ? 2 : this.big >= 2 ? 1.2 : .5;
      return {
        stats: `Laughs: ${this.laughs} · Big laughs: ${this.big}/4`,
        leave: this.big >= 3 ? "Reason for leaving: he's not leaving. Sam's booking him again." : "Reason for leaving: the show ended. That's how shows work.",
        inches: inch, joke: null,
      };
    },
  });

  // ---------- Flow ----------
  let ji = 0, job, results = [], playing = false, raf, last;
  const RANKS = [[0, "RAT TAIL\nAPPRENTICE"], [17, "RAT TAIL\nJOURNEYMAN"], [20, "RAT TAIL\nMASTER"], [23, "THE TAIL\nWAGS THE MIKE"]];

  function renderJobs(ol, current) {
    ol.innerHTML = JOBS.map((j, i) => {
      const r = results[i];
      return `<li class="${r ? "done" : i === current ? "now" : ""}"><span>${j.emoji}</span><span><b>${j.title}</b><br><span class="yrs">${j.yrs}</span></span><span class="got">${r ? "+" + r.inches.toFixed(1) + '"' : ""}</span></li>`;
    }).join("");
  }
  function getBest() { try { return +localStorage.getItem("mike-tail-best") || 0; } catch (e) { return 0; } }
  function setBest(n) { try { localStorage.setItem("mike-tail-best", n); } catch (e) {} }
  function title() {
    results = []; inches = 12; ji = 0; drawMike(); setTail(); renderJobs($("jobs"), -1);
    const b = getBest(); $("best").hidden = !b; $("best").textContent = `Longest rat tail so far: ${b.toFixed(1)}"`;
    show("s0");
  }
  function intro() {
    job = JOBS[ji];
    $("iEmoji").textContent = job.emoji; $("iN").textContent = `Job ${ji + 1} of 5`; $("iTitle").textContent = job.title;
    $("iYrs").textContent = job.yrs; $("iBlurb").textContent = job.blurb; $("iHow").textContent = job.how;
    show("s1");
  }
  function begin() {
    show("play"); field.innerHTML = ""; field.className = "field"; $("hTime").classList.remove("low");
    $("hN").textContent = ji + 1; $("hJob").textContent = job.title.replace(/ \(.*\)/, "");
    measure(); job.init(); playing = true; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (job.tick(dt)) return done();
    raf = requestAnimationFrame(loop);
  }
  field.addEventListener("pointerdown", e => {
    if (!playing) return; e.preventDefault();
    const r = field.getBoundingClientRect(); job.tap(e.clientX - r.left, e.clientY - r.top);
  });
  function done() {
    playing = false; cancelAnimationFrame(raf);
    const r = job.finish(); results[ji] = r; inches += r.inches;
    $("rN").textContent = `Job ${ji + 1} of 5 · ${job.title}`; $("rTitle").textContent = ["Shift over.", "Shift over.", "Bucket's empty.", "Print complete.", "Goodnight, Sisyphus!"][ji];
    $("rStats").textContent = r.stats; $("rLeave").textContent = r.leave;
    $("rGrow").textContent = `Rat tail grew ${r.inches.toFixed(1)}". Now ${inches.toFixed(1)}".`;
    $("next").textContent = ji < JOBS.length - 1 ? `Next job: ${JOBS[ji + 1].title.replace(/ \(.*\)/, "")}` : "Read the résumé";
    show("s3"); setTimeout(setTail, 250);
    tone(523, .1, "triangle", .06, 1); tone(784, .2, "triangle", .06, 1, .1);
  }
  function finale() {
    renderJobs($("fJobs"), -1);
    const rank = RANKS.filter(r => inches >= r[0]).pop()[1];
    $("fObj").textContent = `Five careers. One rat tail, now ${inches.toFixed(1)} inches. References available on request (the raccoon, the dog, Gary).`;
    $("stamp").textContent = rank; $("stamp").style.whiteSpace = "pre-line"; $("stamp").classList.remove("on");
    const best = getBest(); $("newbest").hidden = !(inches > best && best); if (inches > best) setBest(inches);
    show("s4"); setTimeout(() => { $("stamp").classList.add("on"); tone(110, .3, "square", .08, .7); buzz(40); }, 600);
  }

  $("start").addEventListener("click", () => { tone(392, .1, "triangle", .06, 1); intro(); });
  $("go").addEventListener("click", begin);
  $("next").addEventListener("click", () => { ji++; ji < JOBS.length ? intro() : finale(); });
  $("again").addEventListener("click", title);
  drawMike(); title();
})();
</script>
</body>
</html>

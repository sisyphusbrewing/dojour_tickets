<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Sisyphus Trip</title>
  <meta name="description" content="You are coming to Sisyphus. Plan your night: the poster, the green room, security, your guest list and how you get paid.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2929">
  <link rel="icon" type="image/png" href="../brewing/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="fields.js"></script>
  <style>
    /* The advance as a short trip up the hill, one stop at a time. Same brand
       as the site: charcoal, slate blue, white, tilted band headings. */
    :root {
      --bg: #2b2929; --bg2: #232121; --card: #393636; --line: #4a4646; --slate: #4a6c86; --slate-dark: #3b586e; --slate-light: #a9c3d8;
      --gray: #918f90; --white: #fff; --muted: #d9d6d6; --paper: #f4f1ea;
      --head: 'Josefin Sans', 'Century Gothic', Futura, sans-serif;
      --body: 'Assistant', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; color: var(--white); background: var(--bg); }
    body { font-family: var(--body); font-size: 17px; line-height: 1.45; min-height: 100vh; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    html.framed body { min-height: 0; border-radius: 14px; }
    a { color: var(--slate-light); }
    button, input, textarea { font: inherit; color: inherit; }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .step, .boulder, .tile { animation: none !important; transition: none !important; } }

    .wrap { max-width: 620px; margin: 0 auto; padding: 18px 16px 40px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand img { height: 38px; }
    .brand b { font-family: var(--head); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; line-height: 1.1; }
    .brand small { display: block; font-family: var(--body); letter-spacing: .02em; text-transform: none; color: var(--slate-light); font-weight: 600; margin-top: 3px; }
    .demo { font-family: var(--head); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; border: 1px dashed var(--gray); color: var(--gray); padding: 5px 9px 3px; border-radius: 999px; }

    /* the hill: the boulder climbs it as you go */
    .hill { margin: 16px 0 6px; height: 70px; }
    .hill svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .boulder { transition: transform .6s ease-out; }
    .hill-label { display: flex; justify-content: space-between; font-family: var(--head); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--gray); }

    /* a stop */
    .step { animation: rise .3s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .band-wrap { margin: 22px 0 6px; padding: 8px 0; }
    .band { display: inline-block; background: var(--slate); color: #fff; padding: 8px 16px 5px; font-family: var(--head); font-weight: 700; text-transform: uppercase;
            letter-spacing: .14em; font-size: 13px; transform: rotate(-1.5deg);
            box-shadow: 0 -4px 0 -1px var(--bg), 0 -6px 0 -1px #fff, 0 4px 0 -1px var(--bg), 0 6px 0 -1px #fff; }
    h1 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(26px, 7vw, 36px); line-height: 1.08; margin: 14px 0 8px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 17px; }

    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tiles.wide { grid-template-columns: 1fr; }
    @media (min-width: 520px) { .tiles:not(.wide) { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tile { position: relative; display: flex; align-items: center; min-height: 60px; padding: 12px 40px 12px 16px; border-radius: 12px; text-align: left;
            background: var(--card); border: 1px solid var(--line); cursor: pointer; font-weight: 600; font-size: 16px; line-height: 1.25; transition: border-color .15s, background .15s; }
    .tile:hover { border-color: var(--gray); }
    .tile:active { transform: scale(.98); }
    .tile[aria-pressed=true] { border-color: var(--slate-light); background: var(--slate-dark); }
    .tile::after { content: ''; position: absolute; top: 50%; right: 14px; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 1px solid var(--gray); }
    .tile[aria-pressed=true]::after { content: '✓'; border-color: #fff; background: #fff; color: var(--slate-dark); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .tile:focus-visible { outline: 2px solid var(--slate-light); outline-offset: 2px; }

    .field { margin-top: 14px; }
    .q + .q { margin-top: 24px; }
    .field label { display: block; font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--slate-light); margin-bottom: 8px; }
    .req { color: #e9a79a; }
    .input { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--white); outline: none; font-size: 17px; }
    textarea.input { min-height: 104px; resize: vertical; }
    .input:focus { border-color: var(--slate-light); }
    .input::placeholder { color: #7a7677; }
    .help { color: var(--gray); font-size: 14px; margin-top: 6px; }

    .stepper { display: flex; align-items: center; gap: 18px; }
    .stepper button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 24px; cursor: pointer; }
    .stepper button:active { transform: scale(.95); }
    .stepper .n { font-family: var(--head); font-weight: 700; font-size: 40px; min-width: 56px; text-align: center; line-height: 1; padding-top: 6px; }
    .stepper-note { color: var(--gray); margin-top: 8px; min-height: 22px; font-size: 15px; }

    .drop { display: flex; align-items: center; gap: 16px; padding: 12px; border-radius: 12px; border: 1px dashed var(--gray); background: var(--bg2); cursor: pointer; }
    .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .drop-img { flex: 0 0 84px; height: 84px; border-radius: 10px; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--gray); overflow: hidden; }
    .drop-img img { width: 100%; height: 100%; object-fit: cover; }
    .drop:focus-within { outline: 2px solid var(--slate-light); outline-offset: 2px; }

    .nav { display: flex; align-items: center; gap: 10px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 14px 22px 10px; border-radius: 12px; border: 0; cursor: pointer;
           font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 16px; text-decoration: none; }
    .btn:active { transform: scale(.98); }
    .btn-go { flex: 1; background: var(--slate); color: #fff; }
    .btn-go:hover { background: var(--slate-dark); }
    .btn-back { background: transparent; color: var(--muted); border: 1px solid var(--line); min-width: 54px; padding: 12px 16px; letter-spacing: 0; }
    .skip { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--gray); cursor: pointer; font-weight: 600; min-height: 44px; }
    .err { color: #f0b7ac; margin-top: 10px; text-align: center; }

    /* the ticket on the first screen */
    .ticket { position: relative; margin: 18px 0 6px; border-radius: 14px; background: var(--paper); color: #2b2929; padding: 20px 22px 18px; }
    .ticket::before, .ticket::after { content: ''; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--bg); }
    .ticket::before { left: -11px; } .ticket::after { right: -11px; }
    .admit { font-family: var(--head); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; color: var(--slate); }
    .t-name { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(26px, 7vw, 36px); line-height: 1.05; margin: 8px 0 4px; }
    .t-when { font-weight: 700; font-size: 17px; }
    .t-where { color: #5d5959; font-size: 15px; }
    .t-perf { border-top: 1px dashed rgba(43,41,41,.3); margin: 14px -22px 0; padding: 12px 22px 0; display: flex; align-items: baseline; gap: 10px; }
    .t-count { font-family: var(--head); font-weight: 700; font-size: 34px; line-height: 1; color: var(--slate); }
    .t-count-l { font-weight: 600; color: #5d5959; }
    .perks { list-style: none; padding: 0; margin: 18px 0 0; border-top: 1px solid var(--line); }
    .perks li { padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
    .perks li span { color: var(--gray); font-weight: 400; }

    /* the top */
    .pass { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin-top: 18px; }
    .pass div { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .pass div:last-child { border-bottom: 0; }
    .pass span { display: block; font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--slate-light); }
    .pass em { font-style: normal; color: var(--white); font-weight: 600; }
    .next-stop { margin-top: 18px; border-radius: 14px; padding: 16px; background: var(--card); border: 1px solid var(--slate); }
    .next-stop h2 { font-family: var(--head); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 4px; font-size: 18px; }
    .next-stop p { margin: 0; color: var(--muted); }
    .camus { text-align: center; font-style: italic; color: var(--slate-light); margin-top: 28px; font-size: 15px; }
    .foot { text-align: center; color: var(--gray); font-size: 13px; margin-top: 10px; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="https://www.sisyphusbrewing.com" target="_top">
        <img src="../posters/assets/sisyphus-badge-dark-bg.png" alt="">
        <b>Sisyphus<small>Comedy &amp; beer · Minneapolis</small></b>
      </a>
      <span class="demo hidden" id="demoPill">Preview</span>
    </div>

    <div class="hill hidden" id="hill" aria-hidden="true">
      <svg viewBox="0 0 600 74" preserveAspectRatio="none">
        <path id="hillPath" d="M10 66 C 150 64, 260 52, 360 34 S 520 12, 586 12" fill="none" stroke="#4a4646" stroke-width="3" stroke-linecap="round"/>
        <path d="M586 12 V -8 M586 -8 l12 4 l-12 4" fill="none" stroke="#a9c3d8" stroke-width="2"/>
        <g class="boulder" id="boulder"><circle r="10" fill="#918f90" stroke="#2b2929" stroke-width="2"/></g>
      </svg>
      <div class="hill-label"><span>The bottom</span><span id="hillCount"></span><span>The top</span></div>
    </div>

    <main id="stage"><div class="center" style="padding:80px 0;color:var(--muted)">Finding your show…</div></main>

    <p class="camus">Il faut imaginer Sisyphe heureux.</p>
    <p class="foot">Sisyphus · 712 Ontario Ave W, Minneapolis · <a href="mailto:booking@sisyphusbrewing.com">booking@sisyphusbrewing.com</a></p>
  </div>

  <script>
    var SUPABASE_URL = 'https://idsdwkubqnavkazlteis.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc2R3a3VicW5hdmthemx0ZWlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTA2MTMsImV4cCI6MjEwNTY2NjYxM30.EUnNEOHYlNup7nBFvs--pCiyis-NYPiL_TeoiMEjDRQ';
    var FORM_URL = 'https://www.sisyphusbrewing.com/pages/advance';   // the rest of the advance
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    var token = new URLSearchParams(location.search).get('s') || '';
    var demo = !token;                       // no link: a look-around preview that saves nothing
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Embedded in sisyphusbrewing.com/pages/trip (same messages as the advance form).
    var framed = window.parent !== window;
    if (framed) {
      document.documentElement.classList.add('framed');
      var tell = function () { try { parent.postMessage({ advanceHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); } catch (e) {} };
      if (window.ResizeObserver) new ResizeObserver(tell).observe(document.body); else setInterval(tell, 500);
      window.addEventListener('load', tell);
    }
    function toTop() { if (framed) { try { parent.postMessage({ advanceScrollTop: true }, '*'); } catch (e) {} } else { window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); } }

    /* ---------- the stops (labels and options come from fields.js) ---------- */
    var FIELDS = {};
    ADVANCE_SECTIONS.forEach(function (s) { s.fields.forEach(function (f) { FIELDS[f.k] = f; }); });

    // Each stop asks a few things. q: field keys from fields.js, or {k, label, ph, when: [key, value]}.
    // Copy is Sam's voice: short, first person, one dry joke at most.
    var STEPS = [
      { kind: 'hello' },
      { land: 'Green room', title: 'Stock the green room.', sub: 'I go shopping before you get here. Pick whatever.', q: ['gr_snacks', 'gr_drinks'] },
      { land: 'Requests', title: 'Anything special?', sub: 'The one thing that makes it a good night. Plus anything you can\'t eat.',
        q: [{ k: 'gr_wish', ph: 'Peanut M&Ms. Within reason.' }, { k: 'dietary', label: 'Allergies or diet', ph: 'Allergies, diet, strong opinions' }] },
      { land: 'Security', title: 'Security.', sub: 'Most nights are easy. Some aren\'t. Only Grace and I see this part.',
        q: ['sec_style', 'sec_heckle', { k: 'sec_concerns', ph: 'An ex, a superfan, a guy from Reddit. What they look like, what to do.' }] },
      { land: 'Guests', title: 'Bringing people?', sub: 'The guest list walks right in. Funny friend in town? Give them a guest set.',
        q: ['guest_count', { k: 'guest_names', when: ['guest_count', '+'] }, 'gs_want', { k: 'gs_who', when: ['gs_want', 'Yes'] }] },
      { land: 'Pay', title: 'Getting paid.', sub: '100% of the door goes to you. We settle up the night of the show.',
        q: ['pay_method', { k: 'pay_handle', ph: 'Handle, email or phone', when: ['pay_method', '!Cash'] }] },
      { land: 'Last thing', title: 'Walk-on song?', sub: 'Pick it, or the sound guy will. He likes Creed.',
        q: [{ k: 'walk_on', ph: 'Song and artist' }, { k: 'anything', label: 'Anything else', ph: 'Questions, requests, confessions. I read all of it.' }] },
      { kind: 'finale' },
    ];
    var STOPS = STEPS.filter(function (s) { return s.land; });
    function qk(q) { return typeof q === 'string' ? q : q.k; }
    function qo(q) { return typeof q === 'string' ? { k: q } : q; }

    /* ---------- state ---------- */
    var advance = null, answers = {}, at = 0, visited = {}, headshotPath = null, headshotFile = null;
    var draftKey = 'trip-draft:' + (token || 'demo');
    function saveDraft() { try { localStorage.setItem(draftKey, JSON.stringify({ answers: answers, at: at, visited: visited })); } catch (e) {} }
    function loadDraft() { try { return JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch (e) { return null; } }

    function parseDate(d) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function fmtDate(d) { return d ? parseDate(d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : ''; }
    function sleeps(d) { if (!d) return null; var t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parseDate(d) - t) / 864e5); }
    function list(v) { return v ? String(v).split(', ').filter(Boolean) : []; }
    function publicUrl(path) { return SUPABASE_URL + '/storage/v1/object/public/advance/' + path; }

    /* ---------- the hill ---------- */
    function moveBoulder() {
      var stop = STEPS[at], i = stop.kind === 'finale' ? STOPS.length : STOPS.indexOf(stop);
      $('hill').classList.toggle('hidden', stop.kind === 'hello');
      var path = $('hillPath'), frac = Math.max(0, i) / STOPS.length, pt = path.getPointAtLength(path.getTotalLength() * frac);
      $('boulder').setAttribute('transform', 'translate(' + pt.x + ',' + (pt.y - 10) + ') rotate(' + Math.round(frac * 1080) + ')');
      $('hillCount').textContent = stop.kind === 'finale' ? 'Made it!' : 'Stop ' + (i + 1) + ' of ' + STOPS.length;
    }

    /* ---------- render ---------- */
    function shown(q, vals) {
      if (!q.when) return true;
      var v = vals[q.when[0]], want = q.when[1];
      if (want === '+') return Number(v) > 0;
      if (want.charAt(0) === '!') return !!v && v !== want.slice(1);
      return v === want;
    }
    function question(q) {
      var f = FIELDS[q.k], id = 'f_' + q.k, lab = esc(q.label || f.label) + (f.req ? ' <span class="req">*</span>' : ''), v = answers[q.k];
      var inner;
      if (f.type === 'select' || f.type === 'checks') {
        var cur = f.type === 'checks' ? list(v) : [v], longest = Math.max.apply(null, f.options.map(function (o) { return o.length; }));
        inner = '<div class="tiles' + (longest > 22 ? ' wide' : '') + '" data-k="' + q.k + '" data-multi="' + (f.type === 'checks') + '">' + f.options.map(function (o) {
          return '<button type="button" class="tile" data-v="' + esc(o) + '" aria-pressed="' + (cur.indexOf(o) >= 0) + '">' + esc(o) + '</button>';
        }).join('') + '</div>';
      } else if (q.k === 'guest_count') {
        inner = '<div class="stepper"><button type="button" data-step="-1" aria-label="One fewer">−</button><div class="n" id="' + id + '">' + (Number(v) || 0) + '</div><button type="button" data-step="1" aria-label="One more">+</button></div><div class="stepper-note" id="gNote"></div>';
        lab = 'How many guests';
      } else if (f.type === 'file') {
        var have = headshotFile ? URL.createObjectURL(headshotFile) : headshotPath ? publicUrl(headshotPath) : '';
        inner = '<label class="drop" for="' + id + '"><input type="file" accept="image/*" id="' + id + '"><span class="drop-img" id="dropImg">' + (have ? '<img src="' + esc(have) + '" alt="">' : '+') + '</span>' +
          '<span><b>' + (have ? 'Got it. Tap to swap it.' : 'Add your headshot') + '</b><br><span class="help">The biggest, sharpest one you have. No screenshots of screenshots.</span></span></label>';
      } else if (f.type === 'textarea') {
        inner = '<textarea class="input" id="' + id + '" placeholder="' + esc(q.ph || '') + '">' + esc(v || '') + '</textarea>';
      } else {
        var t = f.type === 'number' ? 'text" inputmode="numeric' : (f.type || 'text');
        inner = '<input class="input" type="' + t + '" id="' + id + '" placeholder="' + esc(q.ph || '') + '" value="' + esc(v == null ? '' : v) + '"' +
          (f.type === 'email' ? ' autocomplete="email"' : f.type === 'tel' ? ' autocomplete="tel"' : '') + '>';
      }
      return '<div class="field q' + (shown(q, answers) ? '' : ' hidden') + '" data-q="' + q.k + '"><label' + (f.type === 'select' || f.type === 'checks' ? '' : ' for="' + id + '"') + '>' + lab + '</label>' + inner + (f.help && f.type !== 'file' && !q.ph ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
    }
    function nav(nextLabel) {
      return '<div class="err hidden" id="err"></div><div class="nav">' + (at > 0 ? '<button class="btn btn-back" id="back" type="button" aria-label="Back">←</button>' : '') +
        '<button class="btn btn-go" id="next" type="button">' + nextLabel + '</button></div>';
    }
    function render() {
      var s = STEPS[at], html;
      moveBoulder();
      if (s.kind === 'hello') html = renderHello();
      else if (s.kind === 'finale') html = renderFinale();
      else {
        var last = STEPS[at + 1].kind === 'finale';
        html = '<div class="band-wrap"><span class="band">' + String(STOPS.indexOf(s) + 1).padStart(2, '0') + ' · ' + esc(s.land) + '</span></div><h1>' + s.title + '</h1><p class="sub">' + esc(s.sub) + '</p>' +
          s.q.map(function (q) { return question(qo(q)); }).join('') +
          nav(last ? 'Send it' : 'Next') + '<button class="skip" id="skip" type="button">' + (last ? 'Nothing else, send it' : 'Skip') + '</button>';
        if (last) html = html.replace('id="skip"', 'id="skipLast"');
      }
      $('stage').innerHTML = '<section class="step">' + html + '</section>';
      wire(s);
    }

    function renderHello() {
      var a = advance || {}, n = sleeps(a.show_date), who = (a.contact_name || '').split(' ')[0];
      var count = n == null ? '' : n > 1 ? '<span class="t-count">' + n + '</span><span class="t-count-l">days out</span>'
        : n === 1 ? '<span class="t-count">1</span><span class="t-count-l">day out. Tomorrow.</span>'
        : n === 0 ? '<span class="t-count-l">Tonight.</span>' : '<span class="t-count-l">Thanks for a great show.</span>';
      var back = a.status === 'submitted' ? '<p class="sub" style="margin-top:16px">You already sent this in. Change whatever you need and send it again.</p>' : '';
      return '<div class="band-wrap"><span class="band">You\'re booked</span></div>' +
        '<h1>' + (who ? 'Hey ' + esc(who) + ', congrats.' : 'Hey there, congrats.') + '</h1>' +
        '<p class="sub">You\'re playing Sisyphus, the Disney World of Comedy. (Smaller. No mouse. Way better beer.)</p>' +
        '<div class="ticket"><div class="admit">Admit one comedian, plus guests</div><div class="t-name">' + esc(a.show_name || 'Your Name Here') + '</div>' +
        '<div class="t-when">' + esc([fmtDate(a.show_date), a.show_time].filter(Boolean).join(' · ') || 'Date to come') + '</div>' +
        '<div class="t-where">712 Ontario Ave W, Minneapolis</div>' + (count ? '<div class="t-perf">' + count + '</div>' : '') + '</div>' + back +
        '<p class="sub" style="margin-top:22px">Your agent and Grace handle the boring stuff. This is just so I can be ready for you. ' + STOPS.length + ' quick ones, mostly taps. -Sam</p>' +
        '<ul class="perks"><li>A green room stocked how you like it</li><li>Security handled your way</li><li>Guest sets for your funny friends</li><li>100% of the door. <span>Since day one.</span></li></ul>' +
        nav('Let\'s go');
    }

    function renderFinale() {
      var a = answers, rows = [
        ['Green room', [a.gr_snacks, a.gr_drinks].filter(Boolean).join(' · ')],
        ['The one thing', a.gr_wish],
        ['Security', [a.sec_style, a.sec_heckle].filter(Boolean).join(' · ')],
        ['Guest list', a.guest_count ? a.guest_count + (a.guest_names ? ': ' + a.guest_names : '') : ''],
        ['Guest sets', a.gs_want === 'Yes' ? (a.gs_who || 'Yes') : ''],
        ['Getting paid', a.pay_method],
        ['Walk-on', a.walk_on],
      ].filter(function (r) { return r[1]; });
      return '<div class="band-wrap"><span class="band">The top</span></div>' +
        '<h1>That\'s it. You made it up the hill.</h1>' +
        '<p class="sub">' + (demo ? 'This is a preview, so nothing went anywhere.' : 'Grace has it.') + ' The boulder rolls back down tomorrow... that\'s the job. See you at the show. Cheers! -Sam</p>' +
        (rows.length ? '<div class="pass">' + rows.map(function (r) { return '<div><span>' + esc(r[0]) + '</span><em>' + esc(r[1]) + '</em></div>'; }).join('') + '</div>' : '') +
        '<button class="skip" id="again" type="button">Change an answer</button>';
    }

    /* ---------- read a stop ---------- */
    function readStop(s) {
      var out = {};
      s.q.map(qo).forEach(function (q) {
        var f = FIELDS[q.k], box = document.querySelector('[data-q="' + q.k + '"]'), hidden = box && box.classList.contains('hidden');
        if (f.type === 'file') return;
        if (hidden) { out[q.k] = ''; return; }
        if (f.type === 'select' || f.type === 'checks') {
          out[q.k] = Array.prototype.filter.call(box.querySelectorAll('.tile'), function (t) { return t.getAttribute('aria-pressed') === 'true'; }).map(function (t) { return t.getAttribute('data-v'); }).join(', ');
        } else if (q.k === 'guest_count') {
          out[q.k] = Number($('f_guest_count').textContent) || '';
        } else {
          var v = $('f_' + q.k).value.trim(); out[q.k] = f.type === 'number' && v ? (Number(v.replace(/[^0-9.]/g, '')) || v) : v;
        }
      });
      return out;
    }
    function refreshWhen(s) {
      var now = Object.assign({}, answers, readStop(s));
      s.q.map(qo).forEach(function (q) { if (q.when) { var b = document.querySelector('[data-q="' + q.k + '"]'); var on = shown(q, now); if (b.classList.contains('hidden') === on) { b.classList.toggle('hidden', !on); } } });
    }

    /* ---------- wire up a stop ---------- */
    function wire(s) {
      Array.prototype.forEach.call(document.querySelectorAll('.tiles'), function (tiles) {
        var multi = tiles.getAttribute('data-multi') === 'true';
        tiles.addEventListener('click', function (e) {
          var t = e.target.closest('.tile'); if (!t) return;
          var on = t.getAttribute('aria-pressed') !== 'true';
          if (!multi) Array.prototype.forEach.call(tiles.querySelectorAll('.tile'), function (x) { x.setAttribute('aria-pressed', 'false'); });
          else if (on) {   // "Nothing" and the rest do not mix
            var nothing = /^Nothing/.test(t.getAttribute('data-v'));
            Array.prototype.forEach.call(tiles.querySelectorAll('.tile'), function (x) { if (x !== t && /^Nothing/.test(x.getAttribute('data-v')) !== nothing) x.setAttribute('aria-pressed', 'false'); });
          }
          t.setAttribute('aria-pressed', String(multi ? on : true));
          refreshWhen(s);
        });
      });
      var gN = $('f_guest_count');
      if (gN) {
        var set = function (d) {
          var n = Math.max(0, Math.min(30, (Number(gN.textContent) || 0) + d)); gN.textContent = n;
          $('gNote').textContent = n === 0 ? 'Just you. Respect.' : n < 5 ? 'Easy. Names below.' : n < 11 ? 'A crew. Names below.' : 'A busload. Grace will call you.';
          refreshWhen(s);
        };
        Array.prototype.forEach.call(document.querySelectorAll('[data-step]'), function (b) { b.addEventListener('click', function () { set(+b.getAttribute('data-step')); }); });
        set(0);
      }
      var hs = $('f_headshot');
      if (hs) hs.addEventListener('change', function () {
        var file = hs.files && hs.files[0]; if (!file) return;
        if (file.size > 20 * 1024 * 1024) { hs.value = ''; showErr('That one is over 20 MB. Impressive, but too big.'); return; }
        headshotFile = file;
        $('dropImg').innerHTML = /heic|heif/.test(file.type) ? '✓' : '<img src="' + URL.createObjectURL(file) + '" alt="">';
        hs.closest('.drop').querySelector('b').textContent = 'Got it. Tap to swap it.';
      });
      if ($('back')) $('back').addEventListener('click', function () { go(at - 1); });
      if ($('skip')) $('skip').addEventListener('click', function () { go(at + 1); });
      if ($('again')) $('again').addEventListener('click', function () { go(1); });
      var finish = async function (patch) {
        var btn = $('next'); btn.disabled = true; btn.textContent = 'Sending…';
        var ok = await send(patch);
        btn.disabled = false; btn.textContent = 'Send it';
        if (!ok) return;
        go(at + 1);
      };
      if ($('skipLast')) $('skipLast').addEventListener('click', function () { finish({}); });
      if ($('next')) $('next').addEventListener('click', async function () {
        if (s.kind === 'hello') { go(1); return; }
        var patch = readStop(s);
        Object.keys(patch).forEach(function (k) { answers[k] = patch[k]; });
        visited[s.land] = true; saveDraft();
        if (STEPS[at + 1].kind === 'finale') { finish(patch); return; }
        var btn = $('next'); btn.disabled = true;
        var ok = await save(patch);
        btn.disabled = false;
        if (ok) go(at + 1);
      });
    }
    function showErr(m) { var e = $('err'); if (!e) return; e.textContent = m; e.classList.remove('hidden'); }

    /* ---------- saving ---------- */
    async function upload() {
      if (!headshotFile || demo) return true;
      var safe = headshotFile.name.replace(/[^A-Za-z0-9._-]+/g, '-').slice(-80), path = token + '/' + Date.now() + '-' + safe;
      var up = await sb.storage.from('advance').upload(path, headshotFile, { contentType: headshotFile.type || 'application/octet-stream', upsert: false });
      if (up.error) { showErr('The headshot did not upload: ' + up.error.message); return false; }
      headshotPath = path; headshotFile = null; return true;
    }
    async function save(patch) {
      if (demo) return true;
      if (!(await upload())) return false;
      var res = await sb.rpc('advance_trip', { p_token: token, p_data: patch, p_headshot_path: headshotPath });
      if (res.error) { showErr('That did not save. Check your connection and try again, or email booking@sisyphusbrewing.com.'); return false; }
      advance = res.data; return true;
    }
    // The last stop sends the whole thing in, same as the one-page form.
    async function send() {
      if (demo) return true;
      if (!(await upload())) return false;
      var data = {};
      Object.keys(answers).forEach(function (k) { if (answers[k] !== '' && answers[k] != null) data[k] = answers[k]; });
      var res = await sb.rpc('advance_submit', { p_token: token, p_data: data, p_headshot_path: headshotPath });
      if (res.error) { showErr('That did not send. Check your connection and try again, or email booking@sisyphusbrewing.com.'); return false; }
      advance = res.data;
      try { localStorage.removeItem(draftKey); } catch (e) {}
      sb.functions.invoke('advance-submitted', { body: { token: token } }).catch(function () {});
      return true;
    }

    function go(i) { at = Math.max(0, Math.min(STEPS.length - 1, i)); if (STEPS[at].kind !== 'finale') saveDraft(); render(); toTop(); }

    async function boot() {
      if (demo) {
        $('demoPill').classList.remove('hidden');
        var d = new Date(); d.setDate(d.getDate() + 23);
        advance = { show_name: 'Your Name Here', show_time: '7pm & 9:30pm', contact_name: '', show_date: d.toISOString().slice(0, 10), data: {} };
      } else {
        var res = await sb.rpc('advance_get', { p_token: token });
        if (res.error || !res.data) {
          $('stage').innerHTML = '<section class="step center"><h1 style="margin-top:40px">That link goes nowhere</h1><p class="sub">Ask Grace for a fresh link: <a href="mailto:booking@sisyphusbrewing.com">booking@sisyphusbrewing.com</a>.</p></section>';
          return;
        }
        advance = res.data; headshotPath = advance.headshot_path || null;
      }
      answers = Object.assign({}, advance.data || {});
      var draft = loadDraft();
      if (draft) { Object.assign(answers, draft.answers || {}); visited = draft.visited || {}; at = Math.min(draft.at || 0, STEPS.length - 2); }
      STOPS.forEach(function (s) { if (s.q.map(qk).some(function (k) { return answers[k] || (k === 'headshot' && headshotPath); })) visited[s.land] = true; });
      render();
    }
    boot();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sisyphus Door</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Door">
  <link rel="icon" type="image/png" href="brewing/icons/icon-192.png">
  <link rel="apple-touch-icon" href="brewing/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="staff.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="staff.js"></script>
</head>
<body>
  <!-- Door staff: tonight's guest list and check-in, nothing else.
       Managers have the rest at manager/. The database enforces the split. -->
  <div id="lock" class="hidden">
    <div class="card">
      <img src="posters/assets/sisyphus-badge-dark-bg.png" alt="Sisyphus">
      <h1 class="hdr-title" style="text-align:center">Door</h1>
      <form id="loginForm" class="stack">
        <div class="field"><label for="login">Username</label>
          <input class="input" id="login" required autocapitalize="none" autocorrect="off" autocomplete="username"></div>
        <div class="field"><label for="password">Password</label>
          <input class="input" id="password" type="password" required autocomplete="current-password"></div>
        <div class="err hidden" id="loginError"></div>
        <button class="btn btn-primary btn-big" id="loginBtn" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="hdr">
        <div class="hdr-brand">
          <img src="posters/assets/sisyphus-badge-dark-bg.png" alt="">
          <div class="hdr-title">Door<small id="tonightLabel">Tonight</small></div>
        </div>
        <div class="hdr-right">
          <div class="count"><b id="countIn">–</b><small id="countOf">checked in</small><div class="meter"><i id="meter" style="width:0"></i></div></div>
          <button class="btn btn-sm" id="syncBtn" onclick="sync()" title="Pull in the latest ticket sales">
            <span id="syncIcon">↻</span> Sync</button>
        </div>
      </div>
      <div class="hdr-tools">
        <div class="chips" id="showChips"></div>
        <div class="search">
          <input class="input" id="search" type="search" placeholder="Search a name" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          <button class="search-clear hidden" id="searchClear" aria-label="Clear">×</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="guestList"><div class="empty">Loading tonight…</div></div>
    <div class="foot">
      <span id="whoami"></span> · <button class="btn-link" onclick="signOut()">Sign out</button>
      <span id="staffLink" class="hidden"> · <a href="staff/">Staff page</a></span>
      <span id="managerLink" class="hidden"> · <a href="manager/">Manager page</a></span>
    </div>
  </main>

  <div class="toast hidden" id="toast"></div>

  <script>
    var shows = [];
    var currentKey = null;
    var guests = [];
    var doneOpen = false;

    function showKey(s) { return s.show_date + '|' + s.show_title; }
    function currentShow() { return shows.find(function (s) { return showKey(s) === currentKey; }); }

    // The show at the door right now: the last one that starts within the hour.
    function pickDefaultShow() {
      var soon = Date.now() + 60 * 60 * 1000;
      var pick = shows[0];
      shows.forEach(function (s) { if (s.ts && s.ts <= soon) pick = s; });
      return pick;
    }

    async function loadShows() {
      var res = await sb.rpc('door_shows');
      if (res.error) { toast('Couldn’t load tonight: ' + res.error.message, true); return; }
      shows = (res.data || []).map(function (s) {
        s.ts = parseShowDateToMillis(s.show_date);
        return s;
      }).sort(function (a, b) { return a.ts - b.ts; });

      if (!shows.length) {
        $('showChips').innerHTML = '';
        $('guestList').innerHTML = '<div class="empty"><b>No shows tonight</b>The boulder rests. So can you.</div>';
        guests = []; updateCount();
        return;
      }
      $('tonightLabel').textContent = 'Tonight · ' + shows[0].show_date.split('•')[0].trim();
      if (!currentShow()) currentKey = showKey(pickDefaultShow());
      renderChips();
      await loadGuests();
    }

    function renderChips() {
      var multiTitle = new Set(shows.map(function (s) { return s.show_title; })).size > 1;
      $('showChips').innerHTML = shows.map(function (s) {
        var on = showKey(s) === currentKey;
        return '<button class="chip' + (on ? ' on' : '') + '" onclick="pickShow(' + jsArg(showKey(s)) + ')">' +
          '<b>' + escapeHtml(showTime(s.show_date)) + '</b>' + (multiTitle || shows.length === 1 ? ' ' + escapeHtml(s.show_title) : '') +
          '<small>' + s.checked_in + ' of ' + s.tickets + ' in</small></button>';
      }).join('');
    }

    function pickShow(key) {
      currentKey = key;
      doneOpen = false;
      renderChips();
      $('guestList').innerHTML = '<div class="empty">Loading…</div>';
      loadGuests();
    }

    async function loadGuests() {
      var s = currentShow();
      if (!s) return;
      var res = await sb.rpc('door_guests', { p_show_date: s.show_date, p_show_title: s.show_title });
      if (res.error) { toast('Couldn’t load the list: ' + res.error.message, true); return; }
      if (showKey(s) !== currentKey) return;   // switched shows while loading
      guests = res.data || [];
      render();
    }

    function render() {
      var s = currentShow();
      renderGuests($('guestList'), guests, { query: $('search').value, showDoneOpen: doneOpen, toggleFn: 'toggleDone',
        otherShows: s && { show_date: s.show_date, show_title: s.show_title, openFn: 'openOtherShow',
          canOpen: function (g) { return shows.some(function (x) { return showKey(x) === showKey(g); }); } } });
      updateCount();
    }

    // "Go to show" on a match from another of tonight's shows; keeps the search.
    function openOtherShow(date, title) { pickShow(showKey({ show_date: date, show_title: title })); }

    function toggleDone() { doneOpen = !doneOpen; render(); }

    function updateCount() {
      var total = guests.reduce(function (a, t) { return a + (t.tickets || 1); }, 0);
      var inside = guests.reduce(function (a, t) { return a + (t.checked_in_count || 0); }, 0);
      $('countIn').textContent = total ? inside + '/' + total : '–';
      $('countOf').textContent = 'checked in';
      $('meter').style.width = total ? Math.round(inside / total * 100) + '%' : '0';
      var s = currentShow();
      if (s) { s.tickets = total; s.checked_in = inside; renderChips(); }
    }

    async function checkIn(id, count) {
      var g = guests.find(function (t) { return t.unique_id === id; });
      if (!g) return;
      var before = g.checked_in_count;
      g.checked_in_count = count;
      render();
      chime(count > before);
      var res = await sb.rpc('door_check_in', { p_unique_id: id, p_count: count });
      if (res.error || !res.data || !res.data.length) {
        g.checked_in_count = before;
        render();
        chime(false);
        toast('Not saved. Check the wifi and tap again.', true);
      }
    }

    async function sync() {
      $('syncIcon').classList.add('spin');
      var r = await runWorkflow('daily_sync.yml', {});
      toast(r.ok ? 'Pulling in new sales. Give it a minute.' : 'Sync failed: ' + r.error, !r.ok);
      setTimeout(async function () { await loadShows(); $('syncIcon').classList.remove('spin'); }, 5000);
    }

    $('search').addEventListener('input', function () {
      $('searchClear').classList.toggle('hidden', !this.value);
      render();
    });
    $('searchClear').addEventListener('click', function () {
      $('search').value = '';
      this.classList.add('hidden');
      render();
      $('search').focus();
    });

    setupSignIn(async function (role) {
      var u = (await sb.auth.getUser()).data.user;
      $('whoami').textContent = u ? u.email.replace('@' + LOGIN_DOMAIN, '') : '';
      $('staffLink').classList.toggle('hidden', !roleAtLeast(role, 'staff'));
      $('managerLink').classList.toggle('hidden', !roleAtLeast(role, 'manager'));
      await loadShows();
      // Keep every door device in step.
      setInterval(function () { if (!document.hidden) loadShows(); }, 20000);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sisyphus Door</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Door">
  <link rel="icon" type="image/png" href="brewing/icons/icon-192.png">
  <link rel="apple-touch-icon" href="brewing/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="staff.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="staff.js"></script>
</head>
<body>
  <!-- Door staff: tonight's guest list and check-in, nothing else.
       Managers have the rest at manager/. The database enforces the split. -->
  <div id="lock" class="hidden">
    <div class="card">
      <img src="posters/assets/sisyphus-badge-dark-bg.png" alt="Sisyphus">
      <h1 class="hdr-title" style="text-align:center">Door</h1>
      <form id="loginForm" class="stack">
        <div class="field"><label for="login">Username</label>
          <input class="input" id="login" required autocapitalize="none" autocorrect="off" autocomplete="username"></div>
        <div class="field"><label for="password">Password</label>
          <input class="input" id="password" type="password" required autocomplete="current-password"></div>
        <div class="err hidden" id="loginError"></div>
        <button class="btn btn-primary btn-big" id="loginBtn" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="hdr">
        <div class="hdr-brand">
          <img src="posters/assets/sisyphus-badge-dark-bg.png" alt="">
          <div class="hdr-title">Door<small id="tonightLabel">Tonight</small></div>
        </div>
        <div class="hdr-right">
          <div class="count"><b id="countIn">–</b><small id="countOf">checked in</small><div class="meter"><i id="meter" style="width:0"></i></div></div>
          <button class="btn btn-sm" id="syncBtn" onclick="sync()" title="Pull in the latest ticket sales">
            <span id="syncIcon">↻</span> Sync</button>
        </div>
      </div>
      <div class="hdr-tools">
        <div class="chips" id="showChips"></div>
        <div class="search">
          <input class="input" id="search" type="search" placeholder="Search a name" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          <button class="search-clear hidden" id="searchClear" aria-label="Clear">×</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="offlineBar" class="offline-bar hidden" role="status"></div>
    <div id="guestList"><div class="empty">Loading tonight…</div></div>
    <!-- The people at the door are mostly comics, not on the time clock: this
         is how they say they worked, so Sam can pay them (Sam, Nov 17 2026). -->
    <div class="foot door-pay" style="font-size:15px"><a href="doorshift/">Worked the door tonight? Send it in here so you get paid.</a></div>
    <div class="foot">
      <span id="whoami"></span> · <button class="btn-link" onclick="signOutDoor()">Sign out</button>
      <span id="staffLink" class="hidden"> · <a href="staff/">Staff page</a></span>
      <span id="managerLink" class="hidden"> · <a href="manager/">Manager page</a></span>
    </div>
  </main>

  <div class="toast hidden" id="toast"></div>

  <script>
    var shows = [];
    var currentKey = null;
    var guests = [];
    var doneOpen = false;

    // ---------- Works without internet ----------
    // Sam, Nov 18 2026: "For every show there needs to be the ability for it
    // to run in every scenario except a power outage." This phone keeps a copy
    // of tonight's lists every time they load. If the wifi or the database
    // goes down, the door keeps working from that copy, check-ins wait on the
    // phone, and they are sent as soon as the connection is back.
    // door-sw.js keeps the page itself opening with no internet.
    // The copy lives only on this phone and is wiped on Sign out.
    var SAVED = 'door.saved.v1';    // { at, shows, guests: { showKey: [...] } }
    var WAITING = 'door.waiting.v1'; // check-ins not sent yet: [{ id, count, key, at }]
    var offline = false;

    function readStore(name, empty) {
      try { var v = JSON.parse(localStorage.getItem(name)); return v == null ? empty : v; } catch (e) { return empty; }
    }
    function writeStore(name, value) {
      try { localStorage.setItem(name, JSON.stringify(value)); } catch (e) {}
    }
    function saved() { return readStore(SAVED, null) || { at: 0, shows: [], guests: {} }; }
    function waiting() { return readStore(WAITING, []); }

    // A copy older than 14 hours is last night's: don't show it.
    function savedForTonight() {
      var s = saved();
      return s.at && Date.now() - s.at < 14 * 60 * 60 * 1000 && s.shows.length ? s : null;
    }
    function saveShows(list) { var s = saved(); s.at = Date.now(); s.shows = list; writeStore(SAVED, s); }
    function saveGuests(key, list) { var s = saved(); s.at = Date.now(); s.guests[key] = list; writeStore(SAVED, s); }

    // A failed call because there's no connection (keep the check-in and try
    // again later), as opposed to the database saying no (don't keep it).
    function isNoConnection(error) {
      if (!navigator.onLine) return true;
      var m = String((error && (error.message || error)) || '');
      return /fetch|network|load failed|timed? ?out|connection/i.test(m);
    }

    // Check-ins made offline win over an older list from the server.
    function applyWaiting(list) {
      var w = waiting();
      list.forEach(function (g) {
        var hit = w.filter(function (x) { return x.id === g.unique_id; }).pop();
        if (hit) g.checked_in_count = hit.count;
      });
      return list;
    }

    function setOffline(on) {
      offline = on;
      var n = waiting().length;
      var bar = $('offlineBar');
      if (!on && !n) { bar.classList.add('hidden'); return; }
      var at = saved().at;
      var time = at ? new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      bar.innerHTML = on
        ? '<b>No connection.</b> Using the list saved on this phone' + (time ? ' at ' + escapeHtml(time) : '') +
          '. Keep checking people in; ' + (n ? n + ' check-in' + (n > 1 ? 's' : '') + ' will be sent' : 'it all gets sent') + ' when the wifi is back.'
        : 'Sending ' + n + ' saved check-in' + (n > 1 ? 's' : '') + '…';
      bar.classList.remove('hidden');
    }

    // Sends the check-ins waiting on this phone, oldest first.
    var sending = false;
    async function sendWaiting() {
      if (sending) return;
      sending = true;
      try {
        var w = waiting();
        while (w.length) {
          var item = w[0];
          var res;
          try { res = await sb.rpc('door_check_in', { p_unique_id: item.id, p_count: item.count }); }
          catch (e) { res = { error: e }; }
          if (res.error && isNoConnection(res.error)) { setOffline(true); return; }
          // Sent, or refused by the database (a refund, a removed ticket): either way it's done here.
          if (res.error || !res.data || !res.data.length) toast('One saved check-in couldn’t be sent (the ticket may have changed).', true);
          w = waiting().filter(function (x) { return !(x.id === item.id && x.at === item.at); });
          writeStore(WAITING, w);
        }
      } finally { sending = false; }
      setOffline(false);
    }

    function showKey(s) { return s.show_date + '|' + s.show_title; }
    function currentShow() { return shows.find(function (s) { return showKey(s) === currentKey; }); }

    // The show at the door right now: the last one that starts within the hour.
    function pickDefaultShow() {
      var soon = Date.now() + 60 * 60 * 1000;
      var pick = shows[0];
      shows.forEach(function (s) { if (s.ts && s.ts <= soon) pick = s; });
      return pick;
    }

    async function loadShows() {
      await sendWaiting();
      var res;
      try { res = await sb.rpc('door_shows'); } catch (e) { res = { error: e }; }
      if (res.error) {
        var copy = savedForTonight();
        if (isNoConnection(res.error) && copy) { showSaved(copy); return; }
        toast('Couldn’t load tonight: ' + res.error.message, true);
        return;
      }
      if (!waiting().length) setOffline(false);
      saveShows(res.data || []);
      useShows(res.data || []);
      await loadGuests();
      saveAllGuests();
    }

    // Draws the lists from this phone's copy (no connection).
    function showSaved(copy) {
      setOffline(true);
      useShows(copy.shows);
      var s = currentShow();
      guests = applyWaiting((s && copy.guests[showKey(s)]) || []);
      render();
    }

    // Keeps every one of tonight's lists on the phone, not just the one on
    // screen, so switching shows still works with no connection.
    async function saveAllGuests() {
      for (var i = 0; i < shows.length; i++) {
        var s = shows[i];
        if (showKey(s) === currentKey) continue;   // just saved by loadGuests
        try {
          var r = await sb.rpc('door_guests', { p_show_date: s.show_date, p_show_title: s.show_title });
          if (!r.error) saveGuests(showKey(s), r.data || []);
        } catch (e) {}
      }
    }

    function useShows(list) {
      shows = (list || []).map(function (s) {
        s.ts = parseShowDateToMillis(s.show_date);
        return s;
      }).sort(function (a, b) { return a.ts - b.ts; });

      if (!shows.length) {
        $('showChips').innerHTML = '';
        $('guestList').innerHTML = '<div class="empty"><b>No shows tonight</b>The boulder rests. So can you.</div>';
        guests = []; updateCount();
        return;
      }
      $('tonightLabel').textContent = 'Tonight · ' + shows[0].show_date.split('•')[0].trim();
      if (!currentShow()) currentKey = showKey(pickDefaultShow());
      renderChips();
    }

    function renderChips() {
      var multiTitle = new Set(shows.map(function (s) { return s.show_title; })).size > 1;
      $('showChips').innerHTML = shows.map(function (s) {
        var on = showKey(s) === currentKey;
        return '<button class="chip' + (on ? ' on' : '') + '" onclick="pickShow(' + jsArg(showKey(s)) + ')">' +
          '<b>' + escapeHtml(showTime(s.show_date)) + '</b>' + (multiTitle || shows.length === 1 ? ' ' + escapeHtml(s.show_title) : '') +
          '<small>' + s.checked_in + ' of ' + s.tickets + ' in</small></button>';
      }).join('');
    }

    function pickShow(key) {
      currentKey = key;
      doneOpen = false;
      renderChips();
      if (offline) {
        guests = applyWaiting(saved().guests[key] || []);
        render();
        return;
      }
      $('guestList').innerHTML = '<div class="empty">Loading…</div>';
      loadGuests();
    }

    async function loadGuests() {
      var s = currentShow();
      if (!s) return;
      var res;
      try { res = await sb.rpc('door_guests', { p_show_date: s.show_date, p_show_title: s.show_title }); } catch (e) { res = { error: e }; }
      if (showKey(s) !== currentKey) return;   // switched shows while loading
      if (res.error) {
        var copy = saved().guests[showKey(s)];
        if (isNoConnection(res.error) && copy) { setOffline(true); guests = applyWaiting(copy); render(); return; }
        toast('Couldn’t load the list: ' + res.error.message, true);
        return;
      }
      saveGuests(showKey(s), res.data || []);
      guests = applyWaiting(res.data || []);
      // VIP answers from the pre-show form; the list still works if this fails.
      try {
        var v = await sb.rpc('door_vip', { p_show_date: s.show_date, p_show_title: s.show_title });
        var by = {};
        (v.data || []).forEach(function (p) { by[p.unique_id] = p; });
        guests.forEach(function (g) { var p = by[g.unique_id]; if (p) Object.assign(g, p, { unique_id: g.unique_id, checked_in_count: g.checked_in_count }); });
        if (!v.error) saveGuests(showKey(s), guests);
      } catch (e) {}
      render();
    }

    function render() {
      var s = currentShow();
      renderGuests($('guestList'), guests, { query: $('search').value, showDoneOpen: doneOpen, toggleFn: 'toggleDone',
        otherShows: s && { show_date: s.show_date, show_title: s.show_title, openFn: 'openOtherShow',
          canOpen: function (g) { return shows.some(function (x) { return showKey(x) === showKey(g); }); } } });
      updateCount();
    }

    // "Go to show" on a match from another of tonight's shows; keeps the search.
    function openOtherShow(date, title) { pickShow(showKey({ show_date: date, show_title: title })); }

    function toggleDone() { doneOpen = !doneOpen; render(); }

    function updateCount() {
      var total = guests.reduce(function (a, t) { return a + (t.tickets || 1); }, 0);
      var inside = guests.reduce(function (a, t) { return a + (t.checked_in_count || 0); }, 0);
      $('countIn').textContent = total ? inside + '/' + total : '–';
      $('countOf').textContent = 'checked in';
      $('meter').style.width = total ? Math.round(inside / total * 100) + '%' : '0';
      var s = currentShow();
      if (s) { s.tickets = total; s.checked_in = inside; renderChips(); }
    }

    async function checkIn(id, count) {
      var g = guests.find(function (t) { return t.unique_id === id; });
      if (!g) return;
      var before = g.checked_in_count;
      g.checked_in_count = count;
      render();
      chime(count > before);
      var s = currentShow();
      if (s) saveGuests(showKey(s), guests);
      // Waiting check-ins go out first, in order, so this one can't jump ahead.
      if (offline || waiting().length) { keepForLater(id, count); return; }
      var res;
      try { res = await sb.rpc('door_check_in', { p_unique_id: id, p_count: count }); } catch (e) { res = { error: e }; }
      if (res.error && isNoConnection(res.error)) { keepForLater(id, count); return; }
      if (res.error || !res.data || !res.data.length) {
        g.checked_in_count = before;
        if (s) saveGuests(showKey(s), guests);
        render();
        chime(false);
        toast('Not saved: ' + (res.error ? res.error.message : 'that ticket wasn’t found') + '.', true);
      }
    }

    // No connection: the check-in stays on this phone and goes out later.
    function keepForLater(id, count) {
      var w = waiting();
      w.push({ id: id, count: count, key: currentKey, at: Date.now() });
      writeStore(WAITING, w);
      setOffline(true);
      sendWaiting();
    }

    // Sign out wipes this phone's copy of the lists (after sending what's waiting).
    async function signOutDoor() {
      await sendWaiting();
      var n = waiting().length;
      if (n && !confirm(n + ' check-in' + (n > 1 ? 's haven’t' : ' hasn’t') + ' been sent yet (no connection). Sign out anyway and lose ' + (n > 1 ? 'them' : 'it') + '?')) return;
      try { localStorage.removeItem(SAVED); localStorage.removeItem(WAITING); } catch (e) {}
      signOut();
    }

    window.addEventListener('online', function () { loadShows(); });
    window.addEventListener('offline', function () { if (savedForTonight()) setOffline(true); });

    async function sync() {
      $('syncIcon').classList.add('spin');
      var r = await runWorkflow('daily_sync.yml', {});
      toast(r.ok ? 'Pulling in new sales. Give it a minute.' : 'Sync failed: ' + r.error, !r.ok);
      setTimeout(async function () { await loadShows(); $('syncIcon').classList.remove('spin'); }, 5000);
    }

    $('search').addEventListener('input', function () {
      $('searchClear').classList.toggle('hidden', !this.value);
      render();
    });
    $('searchClear').addEventListener('click', function () {
      $('search').value = '';
      this.classList.add('hidden');
      render();
      $('search').focus();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/door-sw.js').catch(function () {});
    }

    // Opened with no connection: the sign-in can't be checked, so go straight
    // to the list this phone saved tonight (only a phone that was signed in has one).
    var startedOffline = false;
    function startOffline() {
      var copy = savedForTonight();
      if (!copy || startedOffline) return false;
      startedOffline = true;
      $('lock').classList.add('hidden');
      showSaved(copy);
      // Once the connection is back, start over the normal way.
      window.addEventListener('online', function () { location.reload(); });
      setInterval(async function () { if (await serverReachable()) location.reload(); }, 20000);
      return true;
    }
    // The wifi can be up while the internet behind it is down, so ask the
    // database directly instead of trusting the phone's "online".
    async function serverReachable() {
      try {
        var ctl = new AbortController();
        var t = setTimeout(function () { ctl.abort(); }, 4000);
        var r = await fetch(SUPABASE_URL + '/auth/v1/health', { headers: { apikey: SUPABASE_ANON_KEY }, signal: ctl.signal, cache: 'no-store' });
        clearTimeout(t);
        return r.status < 500;
      } catch (e) { return false; }
    }
    if (!navigator.onLine) startOffline();

    setupSignIn(async function (role) {
      var u = (await sb.auth.getUser()).data.user;
      $('whoami').textContent = u ? u.email.replace('@' + LOGIN_DOMAIN, '') : '';
      $('staffLink').classList.toggle('hidden', !roleAtLeast(role, 'staff'));
      $('managerLink').classList.toggle('hidden', !roleAtLeast(role, 'manager'));
      await loadShows();
      // Keep every door device in step.
      setInterval(function () { if (!document.hidden) loadShows(); }, 20000);
    }, async function () {
      // No login found. With no connection and a list saved tonight, use it.
      if (startedOffline) return true;
      if (!savedForTonight() || await serverReachable()) return false;
      return startOffline();
    });
  </script>
</body>
</html>

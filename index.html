  <div id="lockModal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 mx-auto flex items-center justify-center text-xl">
        🔒
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-100">Sisyphus Door Access</h2>
        <p class="text-xs text-slate-400 mt-1">Enter door staff PIN to proceed</p>

      <form id="pinForm" onsubmit="handlePinSubmit(event)" class="space-y-3">
        <input 
          id="pinInput"

          inputmode="numeric"

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="max-w-2xl mx-auto space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-black tracking-wide text-amber-400">SISYPHUS DOOR</h1>
          <button onclick="lockScreen()" title="Lock Screen" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 px-2 py-0.5 rounded border border-slate-700">
            🔒 Lock
          </button>
        </div>
        <div class="flex items-center gap-2">
          <div id="statsBadge" class="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300">
            Loading...
          </div>
          <!-- Manual Refresh Button -->
          <button 
            id="refreshBtn" 
            onclick="manualRefresh()" 
            title="Refresh guest list for last-minute purchases" 
            class="touch-target flex items-center gap-1.5 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 text-amber-400 hover:text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold transition-all">
            <svg id="refreshIcon" class="w-3.5 h-3.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span id="refreshLabel">Sync</span>
          </button>
        </div>
      </div>

      <!-- Show Selector -->
      <select id="showSelector" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-lg p-2.5 text-sm font-semibold focus:ring-2 focus:ring-amber-400 outline-none">
        <option value="">Loading upcoming shows...</option>
      </select>

      <!-- Instant Search -->
      <div class="relative">
        <input 
          id="searchInput" 
          type="text" 
          placeholder="Search guest name or email..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400"
          autocomplete="off"
          autocorrect="off"
        >
        <button id="clearSearch" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 text-sm font-bold">✕</button>
      </div>
    </div>
  </header>

  <!-- Main Guest List -->
  <main class="max-w-2xl w-full mx-auto px-4 py-4 flex-1">
    <div id="guestList" class="space-y-3">
      <div class="text-center text-slate-500 py-10">Select a show to load the door list.</div>
    </div>
  </main>

  <!-- Mobile Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-amber-400 text-slate-950 px-4 py-2 rounded-full font-black text-xs shadow-2xl flex items-center gap-1.5">
    <span id="toastMsg">Sync complete</span>
  </div>

  <script>
    let tickets = [];
    let audioCtx = null;

    function parseShowDateToMillis(dateStr) {
      if (!dateStr) return Number.MAX_SAFE_INTEGER;
      const raw = String(dateStr).trim();

      // Check for explicit 4-digit year (e.g., 2026)
      const yearMatch = raw.match(/\b(20\d{2})\b/);
      const now = new Date();
      let year = yearMatch ? parseInt(yearMatch[1], 10) : now.getFullYear();

      const monthNames = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
      const monthMatch = raw.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
      
      if (!monthMatch) {
        const parsed = Date.parse(raw);
        return isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
      }

      const monthIdx = monthNames.findIndex(m => monthMatch[1].toLowerCase().startsWith(m));

      // Match day number
      const dayMatch = raw.match(new RegExp(monthMatch[1] + '\\s+(\\d{1,2})(?:st|nd|rd|th)?', 'i'))
                    || raw.match(new RegExp('(\\d{1,2})(?:st|nd|rd|th)?\\s+' + monthMatch[1], 'i'))
                    || raw.match(/\b(\d{1,2})\b/);
      const day = dayMatch ? parseInt(dayMatch[1], 10) : 1;

      // Match time (e.g. 7:00 PM or 8:30pm)
      const timeMatch = raw.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
      let hour = 19;
      let minute = 0;
      if (timeMatch) {
        hour = parseInt(timeMatch[1], 10);
        minute = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
        const ampm = timeMatch[3].toLowerCase();
        if (ampm === 'pm' && hour < 12) hour += 12;
        if (ampm === 'am' && hour === 12) hour = 0;
      }

      // Only advance year if currently Oct/Nov/Dec and show is Jan/Feb
      if (!yearMatch && monthIdx < now.getMonth() && (now.getMonth() - monthIdx) >= 8) {
        year += 1;
      }

      return new Date(year, monthIdx, day, hour, minute).getTime();
    }

    // Web Audio Chime & Mobile Haptics
    function playChime(success = true) {
      if ('vibrate' in navigator) navigator.vibrate(success ? 40 : [30, 50, 30]);
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(success ? 880 : 300, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    // Load available shows
    async function loadShows(preserveSelection = false) {
      const select = document.getElementById('showSelector');
      const prevVal = select.value;

      const { data, error } = await supabaseClient
        .from('tickets')
        .select('show_date, show_title');

      if (error || !data) {
        console.error('Error fetching shows:', error);
        return;
      }

      const uniqueShows = [];
      const seen = new Set();
      // Keep shows that ended within the last 12 hours so tonight's door check-in stays open
      const cutoff = Date.now() - (12 * 60 * 60 * 1000);

      data.forEach(d => {
        if (!d.show_date) return;
        const key = `${d.show_date} • ${d.show_title}`;
        if (!seen.has(key)) {
          seen.add(key);
          const timestamp = parseShowDateToMillis(d.show_date);
          // Strictly exclude events that are already over
          if (timestamp >= cutoff) {
            uniqueShows.push({
              show_date: d.show_date,
              show_title: d.show_title,
              label: key,
              timestamp: timestamp
            });
          }
        }
      });

      // Strict chronological sort (earliest upcoming first)
      uniqueShows.sort((a, b) => a.timestamp - b.timestamp || a.show_title.localeCompare(b.show_title));

      if (uniqueShows.length === 0) {
        select.innerHTML = '<option value="">No upcoming shows scheduled</option>';
        document.getElementById('guestList').innerHTML = '<div class="text-center text-slate-500 py-10">No upcoming shows found.</div>';
        return;
      }

      select.innerHTML = uniqueShows.map(s => 
        `<option value="${encodeURIComponent(JSON.stringify({ show_date: s.show_date, show_title: s.show_title }))}">${s.label}</option>`
      ).join('');

      if (preserveSelection && prevVal && uniqueShows.some(s => encodeURIComponent(JSON.stringify({ show_date: s.show_date, show_title: s.show_title })) === prevVal)) {
        select.value = prevVal;
      } else {
        select.value = encodeURIComponent(JSON.stringify({ show_date: uniqueShows[0].show_date, show_title: uniqueShows[0].show_title }));
      }
      await loadTicketsForCurrentShow();
    }

    // Load tickets for selected show
    async function loadTicketsForCurrentShow() {
      const select = document.getElementById('showSelector');
      if (!select.value) return;
      const show = JSON.parse(decodeURIComponent(select.value));

      const { data, error } = await supabaseClient
        .from('tickets')
        .select('*')
        .eq('show_date', show.show_date)
        .eq('show_title', show.show_title)
        .order('guest_name');

      if (error) {
        console.error('Error fetching tickets:', error);
        return;
      }
      tickets = data || [];
      renderList();
      updateStats();
    }

    // On-Demand Force Refresh
    async function manualRefresh() {
      const btn = document.getElementById('refreshBtn');
      const icon = document.getElementById('refreshIcon');
      const label = document.getElementById('refreshLabel');

      icon.classList.add('animate-spin');
      label.textContent = 'Syncing...';
      btn.disabled = true;

      const previousCount = tickets.length;

      try {
        await loadShows(true);
        const diff = tickets.length - previousCount;

        if (diff > 0) {
          showToast(`+${diff} last-minute guest${diff > 1 ? 's' : ''} added!`);
          playChime(true);
        } else {
          showToast('Guest list is up to date');
        }
      } catch (err) {
        console.error('Refresh error:', err);
        showToast('Refresh failed. Check connection.');
      } finally {
        setTimeout(() => {
          icon.classList.remove('animate-spin');
          label.textContent = 'Sync';
          btn.disabled = false;
        }, 400);
      }
    }

    // Check-in mutations
    async function updateCheckIn(uniqueId, newCount) {
      const record = tickets.find(t => t.unique_id === uniqueId);
      if (!record) return;

      const checkedIn = newCount > 0;
      const checkInTime = checkedIn ? new Date().toISOString() : null;

      // Optimistic Local UI Update
      record.checked_in_count = newCount;
      record.checked_in = checkedIn;
      record.check_in_time = checkInTime;
      renderList();
      updateStats();
      playChime(checkedIn);

      // Persist to Supabase
      const { error } = await supabaseClient
        .from('tickets')
        .update({
          checked_in_count: newCount,
          checked_in: checkedIn,
          check_in_time: checkInTime
        })
        .eq('unique_id', uniqueId);

      if (error) {
        console.error('Failed to update ticket in Supabase:', error);
      }
    }

    // Render guest list
    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('guestList');

      const filtered = tickets.filter(t => 
        t.guest_name.toLowerCase().includes(query) ||
        (t.email && t.email.toLowerCase().includes(query)) ||
        t.unique_id.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-500 py-10">No guests match "${query}"</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const isComplete = t.checked_in_count >= t.tickets;
        const isPartial = t.checked_in_count > 0 && !isComplete;

        return `
          <div class="p-3.5 rounded-xl border transition-all ${
            isComplete 
              ? 'bg-emerald-950/30 border-emerald-800/60' 
              : isPartial 
              ? 'bg-amber-950/30 border-amber-800/60' 
              : 'bg-slate-900 border-slate-800'
          }">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="font-bold text-base text-slate-100">${t.guest_name}</div>
                <div class="text-xs text-slate-400">${t.email || 'No email provided'}</div>
                <div class="flex items-center gap-2 mt-1.5">
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${
                    t.source === 'Website' ? 'bg-indigo-900/60 text-indigo-300' : 'bg-orange-900/60 text-orange-300'
                  }">${t.source}</span>
                  <span class="text-xs font-semibold text-slate-300">
                    ${t.tickets} Ticket${t.tickets > 1 ? 's' : ''}
                  </span>
                </div>
              </div>

              <!-- Interactive Check-In Controls -->
              <div class="flex items-center gap-1.5">
                ${t.tickets === 1 ? `
                  <button 
                    onclick="updateCheckIn('${t.unique_id}',${t.checked_in ? 0 : 1})"
                    class="touch-target px-4 py-2.5 rounded-lg text-sm font-bold shadow ${
                      t.checked_in 
                        ? 'bg-emerald-600 hover:bg-emerald-500 text-white' 
                        : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                    }">
                    ${t.checked_in ? '✓ In' : 'Check In'}
                  </button>
                ` : `
                  <!-- Stepper for Party / Group Arrivals -->
                  <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg p-1">
                    <button 
                      onclick="updateCheckIn('${t.unique_id}', Math.max(0,${t.checked_in_count} - 1))"
                      class="w-8 h-8 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center">
                      -
                    </button>
                    <span class="w-12 text-center text-xs font-extrabold ${isComplete ? 'text-emerald-400' : 'text-amber-400'}">
                      ${t.checked_in_count}/${t.tickets}
                    </span>
                    <button 
                      onclick="updateCheckIn('${t.unique_id}', Math.min(${t.tickets},${t.checked_in_count} + 1))"
                      class="w-8 h-8 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center">
                      +
                    </button>
                  </div>
                  ${t.checked_in_count < t.tickets ? `
                    <button 
                      onclick="updateCheckIn('${t.unique_id}', ${t.tickets})"
                      class="touch-target px-3 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black rounded-lg">
                      All
                    </button>
                  ` : ''}
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      const totalSold = tickets.reduce((acc, t) => acc + t.tickets, 0);
      const totalChecked = tickets.reduce((acc, t) => acc + t.checked_in_count, 0);
      const pct = totalSold ? Math.round((totalChecked / totalSold) * 100) : 0;
      document.getElementById('statsBadge').textContent = `${totalChecked} / ${totalSold} In (${pct}%)`;
    }

    // Search events
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearch');
    searchInput.addEventListener('input', (e) => {
      clearBtn.classList.toggle('hidden', !e.target.value);
      renderList();
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderList();
      searchInput.focus();
    });

    document.getElementById('showSelector').addEventListener('change', loadTicketsForCurrentShow);

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function handlePinSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('pinInput');
      const errorMsg = document.getElementById('pinError');
      const hash = await sha256(input.value.trim());

      if (hash === DOOR_PIN_HASH) {
        sessionStorage.setItem('sisyphus_door_auth', 'true');
        document.getElementById('lockModal').classList.add('hidden');
        errorMsg.classList.add('hidden');
        input.value = '';
        initApp();
      } else {
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
      }
    }

    function lockScreen() {
      sessionStorage.removeItem('sisyphus_door_auth');
      document.getElementById('lockModal').classList.remove('hidden');
      document.getElementById('pinInput').focus();
    }

    function checkAuthOnLoad() {
      if (sessionStorage.getItem('sisyphus_door_auth') === 'true') {
        document.getElementById('lockModal').classList.add('hidden');
        initApp();
      } else {
        document.getElementById('lockModal').classList.remove('hidden');
        document.getElementById('pinInput').focus();
      }
    }

    // Real-Time Multi-Device Subscription with safety guard
    function initRealtime() {
      if (supabaseClient && typeof supabaseClient.channel === 'function') {
        try {
          supabaseClient
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, (payload) => {
              const select = document.getElementById('showSelector');
              const currentShow = select.value ? JSON.parse(decodeURIComponent(select.value)) : null;

              if (payload.eventType === 'UPDATE') {
                const idx = tickets.findIndex(t => t.unique_id === payload.new.unique_id);
                if (idx !== -1) {
                  tickets[idx].checked_in = payload.new.checked_in;
                  tickets[idx].checked_in_count = payload.new.checked_in_count;
                  tickets[idx].check_in_time = payload.new.check_in_time;
                  renderList();
                  updateStats();
                }
              } else if (payload.eventType === 'INSERT') {
                // If a new ticket is purchased for the currently active show, insert it automatically!
                if (currentShow && 
                    payload.new.show_date === currentShow.show_date && 
                    payload.new.show_title === currentShow.show_title) {
                  if (!tickets.some(t => t.unique_id === payload.new.unique_id)) {
                    tickets.push(payload.new);
                    tickets.sort((a, b) => a.guest_name.localeCompare(b.guest_name));
                    renderList();
                    updateStats();
                    showToast(`+ New ticket: ${payload.new.guest_name}`);
                    playChime(true);
                  }
                }
              } else if (payload.eventType === 'DELETE') {
                tickets = tickets.filter(t => t.unique_id !== payload.old.unique_id);
                renderList();
                updateStats();
              }
            })
            .subscribe();
        } catch (err) {
          console.warn('Realtime subscription could not be established:', err);
        }
      }
    }

    function initApp() {
      loadShows();
      initRealtime();
    }

    checkAuthOnLoad();
  </script>
</body>

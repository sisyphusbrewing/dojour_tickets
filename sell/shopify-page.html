<!-- Sisyphus: body of the Shopify page "How Shows Actually Sell" (handle: how-shows-sell).
     Embeds the 2-page comics handout from GitHub Pages so comics only see
     sisyphusbrewing.com. NFC tags open /pages/how-shows-sell?t=nfc (QR: ?t=qr). -->
<style>
  .section-header, .announcement-bar-section, .main-page-title { display: none !important; }
  .main-page-title + .rte, .page-width--narrow { padding-top: 0 !important; }
  main#MainContent > .shopify-section:first-child .page-width { padding-top: 12px !important; max-width: 900px !important; }
</style>
<div class="sb-sell" style="max-width:860px;margin:0 auto;">
  <iframe id="sbSell" title="How Shows Actually Sell" src="about:blank"
          style="display:block;width:100%;height:100vh;border:0;border-radius:14px;background:#2b2929;"
          loading="eager"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('sbSell');
    f.src = 'https://staff.sisyphusbrewing.com/sell/' + window.location.search;
    window.addEventListener('message', function (e) {
      if ((e.origin !== 'https://staff.sisyphusbrewing.com' && e.origin !== 'https://sisyphusbrewing.github.io') || !e.data) return;
      if (e.data.sellHeight) f.style.height = (e.data.sellHeight + 16) + 'px';
    });
  })();
</script>

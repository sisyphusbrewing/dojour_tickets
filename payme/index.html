<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Get Paid for a Show · Sisyphus</title>
  <meta name="description" content="Did a show at Sisyphus? Leave your Venmo.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2929">
  <link rel="icon" type="image/png" href="../brewing/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../advance/advance.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Comic-facing, open to anyone: name + Venmo, nothing else (Sam, Nov 5 2026). Goes through
       pay_request(); lands on the pay sheet (payouts/index.html) for Sam to
       approve, and booking@ gets an email. -->
  <header>
    <div class="wrap hdr">
      <a class="hdr-brand" href="https://sisyphusbrewing.com" style="text-decoration:none;color:inherit">
        <img src="../posters/assets/sisyphus-badge-dark-bg.png" alt="">
        <div class="hdr-title">Get paid<small>Sisyphus · Minneapolis</small></div>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section id="viewForm">
      <div class="show-card">
        <div class="show-eyebrow">Did a show?</div>
        <div class="show-name">Get paid on Venmo</div>
        <div class="show-when">Your name and your Venmo. That's it.</div>
      </div>

      <form id="payForm" novalidate>
        <div class="card" style="margin-top:18px"><div class="grid">
          <div class="field full"><label for="f_name">Your name <span class="req">*</span></label>
            <input class="input" id="f_name" maxlength="120" autocomplete="name" required></div>
          <div class="field full"><label for="f_handle">Venmo username <span class="req">*</span></label>
            <input class="input" id="f_handle" maxlength="60" autocapitalize="none" autocorrect="off" placeholder="@yourname" required>
            <div class="help">The one after the @.</div></div>
        </div></div>

        <div class="submit-row">
          <div class="err hidden" id="formError"></div>
          <button class="btn btn-primary btn-big" id="sendBtn" type="submit">Save it</button>
        </div>
      </form>
    </section>

    <section id="viewDone" class="hidden">
      <div class="done">
        <div class="band-wrap"><span class="band">Saved</span></div>
        <p class="done-big" id="doneLine"></p>
        <p>Sam sends it on Venmo. Questions: <a href="mailto:booking@sisyphusbrewing.com">booking@sisyphusbrewing.com</a>.</p>
        <p class="camus">Il faut imaginer Sisyphe heureux. Easier when paid.</p>
        <button class="btn" id="againBtn" type="button">Fix it</button>
      </div>
    </section>
  </main>

  <footer class="wrap foot">Sisyphus · 712 Ontario Ave W, Minneapolis</footer>

  <script>
    var SUPABASE_URL = 'https://idsdwkubqnavkazlteis.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc2R3a3VicW5hdmthemx0ZWlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTA2MTMsImV4cCI6MjEwNTY2NjYxM30.EUnNEOHYlNup7nBFvs--pCiyis-NYPiL_TeoiMEjDRQ';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    var $ = function (id) { return document.getElementById(id); };

    $('payForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('formError'), btn = $('sendBtn');
      var fail = function (m) { err.textContent = m; err.classList.remove('hidden'); };
      err.classList.add('hidden');
      if (!$('f_name').value.trim()) return fail('We need your name.');
      var handle = $('f_handle').value.trim().replace(/^(https?:\/\/)?(www\.)?venmo\.com\/(u\/)?/i, '').replace(/\s+/g, '');
      if (!handle) return fail('We need your Venmo username.');
      if (handle.charAt(0) !== '@') handle = '@' + handle;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        var res = await sb.rpc('pay_request', { p_data: { name: $('f_name').value.trim(), handle: handle } });
        if (res.error) throw new Error(res.error.message);
        sb.functions.invoke('job-applied', { body: { id: res.data, kind: 'pay' } }).catch(function () {});
        $('doneLine').textContent = 'Got it. Venmo to ' + handle + '.';
        $('viewForm').classList.add('hidden'); $('viewDone').classList.remove('hidden');
        window.scrollTo(0, 0);
      } catch (ex) {
        fail(ex.message || 'That did not send. Try again?');
      } finally {
        btn.disabled = false; btn.textContent = 'Save it';
      }
    });
    $('againBtn').addEventListener('click', function () {
      $('viewDone').classList.add('hidden'); $('viewForm').classList.remove('hidden');
    });

  </script>
</body>
</html>

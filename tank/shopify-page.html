<!-- Sisyphus: body of the Shopify page "Sam's Tank" (handle: sams-tank).
     Embeds the pitch form from GitHub Pages so people only see
     sisyphusbrewing.com. -->
<div class="sb-tank" style="max-width:720px;margin:0 auto;">
  <iframe id="sbTank" title="Sam's Tank" src="about:blank"
          style="display:block;width:100%;height:100vh;border:0;border-radius:14px;background:#2b2929;"
          loading="eager"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('sbTank');
    f.src = 'https://staff.sisyphusbrewing.com/tank/' + window.location.search;
    window.addEventListener('message', function (e) {
      if ((e.origin !== 'https://staff.sisyphusbrewing.com' && e.origin !== 'https://sisyphusbrewing.github.io') || !e.data) return;
      if (e.data.tankHeight) f.style.height = (e.data.tankHeight + 16) + 'px';
      if (e.data.tankScrollTop) window.scrollTo({ top: f.getBoundingClientRect().top + window.pageYOffset - 90, behavior: 'smooth' });
    });
  })();
</script>
